<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HoloNeuro TND® · Plataforma UNIMED</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1B3C;--magenta:#E42465;--teal:#3A7D8C;--gold:#C9A84C;--navy10:#E8EBF2;--magenta10:#FCE7EE;--teal10:#EAF3F5;--gold10:#FAF4E0;--bg:#F4F6FB;--surface:#fff;--border:#E2E6F0;--text1:#0F1B3C;--text2:#5A6580;--text3:#9BA8C0;--r:10px;--r-sm:6px}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text1);line-height:1.5;min-height:100vh}
.gate{display:flex;min-height:100vh}
.gate-left{flex:1;background:var(--navy);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between}
.gate-right{width:460px;padding:3rem;display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-dot{width:32px;height:32px;border-radius:50%;background:var(--magenta)}
.logo-text{font-family:'DM Serif Display',serif;font-size:1.1rem;color:#fff}
.gate-title{font-family:'DM Serif Display',serif;font-size:2.6rem;line-height:1.15;margin-bottom:.9rem}
.gate-title em{color:var(--gold);font-style:normal}
.gate-sub{color:rgba(255,255,255,.65);font-size:.9rem;line-height:1.7;margin-bottom:2rem}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:1rem}
.feat-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.feat-label{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:1px}
.feat-desc{font-size:.75rem;color:rgba(255,255,255,.5)}
.gate-divider{height:1px;background:rgba(255,255,255,.12);margin:1.5rem 0}
.stripe-btn{width:100%;padding:14px;background:var(--magenta);color:#fff;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;text-decoration:none;display:block;text-align:center;margin-bottom:.75rem}
.stripe-btn:hover{opacity:.88}
.stripe-note{font-size:.75rem;color:var(--text3);text-align:center;margin-bottom:1.5rem}
.divider-or{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;font-size:.75rem;color:var(--text3)}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}
.inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;color:var(--text1);outline:none;transition:border .2s;margin-bottom:10px}
.inp:focus{border-color:var(--navy)}
.btn-primary{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--magenta);font-size:.8rem;margin:.5rem 0}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);display:flex;flex-direction:column;padding:1.25rem 1rem}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding:0 .5rem}
.sidebar-logo-dot{width:26px;height:26px;border-radius:50%;background:var(--magenta)}
.sidebar-logo-text{font-family:'DM Serif Display',serif;font-size:.95rem;color:#fff}
.patient-switcher{background:rgba(255,255,255,.07);border-radius:8px;padding:.75rem;margin-bottom:1rem}
.ps-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.35);margin-bottom:.4rem}
.ps-select{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-family:inherit;font-size:.82rem;padding:7px 10px;outline:none;cursor:pointer}
.ps-select option{background:var(--navy);color:#fff}
.ps-new{font-size:.73rem;color:rgba(255,255,255,.45);cursor:pointer;margin-top:.4rem;text-decoration:underline}
.ps-new:hover{color:rgba(255,255,255,.7)}
.nav-section{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.3);padding:0 .75rem;margin:.6rem 0 .3rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;cursor:pointer;transition:background .15s;color:rgba(255,255,255,.6);font-size:.85rem;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.ni{font-size:14px;width:18px;text-align:center}
.sidebar-user{margin-top:auto;padding:.65rem;background:rgba(255,255,255,.06);border-radius:7px}
.su-name{font-size:.8rem;font-weight:700;color:#fff}
.su-role{font-size:.68rem;color:rgba(255,255,255,.38)}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{padding:1rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-weight:700;font-size:1rem}
.content{padding:1.75rem 2rem;flex:1}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:1.25rem}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem}
.stat-label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--navy)}
.stat-sub{font-size:.72rem;color:var(--text3);margin-top:1px}
.stat-card.accent-mg{border-left:3px solid var(--magenta)}
.stat-card.accent-tl{border-left:3px solid var(--teal)}
.stat-card.accent-gd{border-left:3px solid var(--gold)}
.stat-card.accent-nv{border-left:3px solid var(--navy)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.sec-title{font-weight:700;font-size:.95rem}
.phase{border:1px solid var(--border);border-radius:var(--r);margin-bottom:.65rem;overflow:hidden;background:var(--surface)}
.phase-header{display:flex;align-items:center;gap:12px;padding:.9rem 1.1rem;cursor:pointer}
.phase-header:hover{background:var(--bg)}
.phase-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.phase-body{padding:1.1rem;border-top:1px solid var(--border);background:#fafbfe}
.phase-item{font-size:.82rem;color:var(--text2);padding:.4rem 0;border-bottom:1px solid var(--border)}
.phase-item:last-child{border-bottom:none}
.phase-item strong{color:var(--text1);display:block;font-size:.83rem;margin-bottom:1px}
.track-tabs{display:flex;gap:4px;background:var(--border);padding:3px;border-radius:7px;margin-bottom:1.1rem;width:fit-content}
.track-tab{padding:6px 18px;border-radius:5px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text2)}
.track-tab.active{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.sessions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
.sess{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:.9rem;cursor:pointer;transition:all .15s;background:var(--surface)}
.sess:hover{border-color:var(--teal);transform:translateY(-1px)}
.sess.done{background:var(--teal10);border-color:var(--teal)}
.sess.current{border-color:var(--magenta);box-shadow:0 0 0 2px rgba(228,36,101,.1)}
.sess-num{font-size:.68rem;color:var(--text3);margin-bottom:3px}
.sess-title{font-size:.8rem;font-weight:600;color:var(--text1);margin-bottom:5px}
.sess-status{font-size:.7rem;font-weight:600}
.sess.done .sess-status{color:var(--teal)}
.sess.current .sess-status{color:var(--magenta)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:1.5rem}
.modal-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:1.1rem}
.modal-title{font-weight:700;font-size:.98rem}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text3);padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--bg)}
.obj-list{margin:.75rem 0;list-style:none}
.obj-list li{font-size:.82rem;color:var(--text2);padding:.35rem 0;border-bottom:1px solid var(--border);display:flex;align-items:start;gap:7px}
.obj-list li:before{content:"→";color:var(--teal);font-weight:700;flex-shrink:0}
textarea.inp{height:80px;resize:vertical;margin-bottom:0}
.btn-sm{padding:7px 14px;border-radius:var(--r-sm);font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:opacity .2s}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{opacity:.88}
.btn-mg{background:var(--magenta);color:#fff}
.btn-mg:hover{opacity:.88}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{opacity:.88}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.check-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.check-row label{font-size:.85rem;cursor:pointer}
input[type=checkbox]{accent-color:var(--teal);width:15px;height:15px;cursor:pointer}
.hnae-step{border:1px solid var(--border);border-radius:var(--r);margin-bottom:.65rem;overflow:hidden;background:var(--surface)}
.hnae-head{padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.hnae-head:hover{background:var(--bg)}
.hnae-body{padding:1.1rem;border-top:1px solid var(--border)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.75rem}
.field-label{font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:.3rem;display:block}
.prog-bar{height:5px;background:var(--border);border-radius:3px;margin:.5rem 0 .3rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--magenta));border-radius:3px;transition:width .4s}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:.5rem 0;display:flex;flex-direction:column;gap:.65rem}
.msg{max-width:84%;padding:.85rem 1rem;border-radius:var(--r);font-size:.85rem;line-height:1.65}
.msg.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--navy);color:#fff;align-self:flex-end}
.msg-role{font-size:.68rem;font-weight:700;color:var(--teal);margin-bottom:.25rem}
.chat-input-row{display:flex;gap:.65rem;padding-top:.9rem;border-top:1px solid var(--border)}
.chat-input-row textarea{flex:1;min-height:42px;max-height:110px;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.85rem;resize:none;outline:none}
.chat-input-row textarea:focus{border-color:var(--teal)}
.loading-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dot .8s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.tarifa-row{display:flex;align-items:center;gap:12px;padding:.75rem 0;border-bottom:1px solid var(--border)}
.tarifa-row:last-child{border-bottom:none}
.tarifa-check{flex-shrink:0}
.tarifa-info{flex:1}
.tarifa-name{font-size:.88rem;font-weight:600}
.tarifa-desc{font-size:.75rem;color:var(--text2)}
.tarifa-price{font-size:.95rem;font-weight:700;color:var(--navy);flex-shrink:0;min-width:70px;text-align:right}
.tarifa-highlight{background:var(--gold10);border-radius:6px;padding:.25rem .6rem;border-left:3px solid var(--gold)}
.total-bar{background:var(--navy);color:#fff;border-radius:var(--r);padding:1.1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.total-label{font-size:.8rem;opacity:.65}
.total-amount{font-size:1.6rem;font-weight:700}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.score-label{font-size:.82rem;color:var(--text2);width:120px;flex-shrink:0}
.score-input{width:65px}
.score-bar{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.score-fill-pre{height:100%;background:var(--text3);border-radius:4px;transition:width .3s}
.score-fill-post{height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.patient-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;cursor:pointer;transition:all .15s}
.patient-card:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(58,125,140,.1)}
.patient-card.active-pat{border-color:var(--magenta);border-width:2px}
.pc-name{font-weight:700;font-size:.95rem;margin-bottom:3px}
.pc-diag{font-size:.75rem;color:var(--text2)}
.pc-meta{font-size:.72rem;color:var(--text3);margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;font-size:.7rem;font-weight:700;padding:2px 8px}
.badge-mg{background:var(--magenta10);color:var(--magenta)}
.badge-tl{background:var(--teal10);color:var(--teal)}
.badge-gd{background:var(--gold10);color:#8a6800}
.badge-nv{background:var(--navy10);color:var(--navy)}
.flex-row{display:flex;align-items:center;gap:.7rem}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt1{margin-top:.75rem}
.mt2{margin-top:1.25rem}
.text-sm{font-size:.8rem;color:var(--text2)}
.divider{height:1px;background:var(--border);margin:1rem 0}
select.inp{cursor:pointer}
.config-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem}
.config-title{font-weight:700;font-size:.9rem;margin-bottom:.75rem}
.code-pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy10);border-radius:6px;padding:4px 10px;font-size:.78rem;font-weight:600;margin:.25rem;color:var(--navy)}
/* ── NIVEL BADGE ────────────────────────── */
.nivel-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:800;margin-top:5px}
.nivel-1{background:#DCFCE7;color:#16A34A}
.nivel-2{background:#DBEAFE;color:#2563EB}
.nivel-3{background:#FEF3C7;color:#D97706}
.nivel-4{background:#FCE7F3;color:#BE185D}
/* ── PROGRAMA VERANO ─────────────────────── */
.verano-hero{background:linear-gradient(135deg,#F97316,#EF4444,#EC4899);border-radius:16px;padding:1.5rem;color:#fff;margin-bottom:1.25rem;position:relative;overflow:hidden}
.verano-hero::before{content:'☀️';position:absolute;right:-10px;top:-10px;font-size:6rem;opacity:.15}
.verano-semana{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:.75rem;overflow:hidden}
.verano-semana-head{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;cursor:pointer;transition:background .15s}
.verano-semana-head:hover{background:var(--bg)}
.verano-semana-body{padding:1rem 1.25rem;border-top:1px solid var(--border);background:#fafbfe}
.verano-dia{border-left:3px solid var(--teal);padding:.6rem .9rem;margin-bottom:.6rem;background:var(--teal10);border-radius:0 8px 8px 0}
.verano-dia:last-child{margin-bottom:0}
.verano-dia-title{font-weight:700;font-size:.85rem;color:var(--navy);margin-bottom:3px}
.verano-dia-acts{font-size:.78rem;color:var(--text2);line-height:1.7}
.verano-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;margin:.2rem}
/* ── CONFIG PANEL ────────────────────────── */
.config-ex-item{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:var(--bg);border-radius:8px;margin-bottom:.5rem;font-size:.82rem}
/* ── ENTRENAMIENTO ───────────────────────── */
.ent-header{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--r);padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
.ent-title{font-weight:800;font-size:1.05rem}
.ent-sub{font-size:.8rem;opacity:.75;margin-top:2px}
.ent-stars{background:rgba(255,255,255,.2);border-radius:50px;padding:.4rem 1rem;font-size:.9rem;font-weight:800}
.ent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.25rem}
.ent-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.25rem;cursor:pointer;transition:all .2s;text-align:center}
.ent-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.ent-card.c1{border-top:4px solid #FF6B9D}
.ent-card.c2{border-top:4px solid #3B82F6}
.ent-card.c3{border-top:4px solid #22C55E}
.ent-card.c4{border-top:4px solid #FF6B35}
.ent-icon{font-size:2.8rem;margin-bottom:.5rem;line-height:1}
.ent-name{font-weight:800;font-size:.95rem;margin-bottom:3px}
.ent-desc{font-size:.75rem;color:var(--text2)}
.ent-count{font-size:.72rem;color:var(--text3);margin-top:4px}
.ent-launch{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;padding:.65rem 1.5rem;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:.75rem;transition:opacity .2s;width:100%}
.ent-launch:hover{opacity:.88}
/* ── EXERCISE FULLSCREEN ─────────────────── */
.ex-overlay{position:fixed;inset:0;z-index:500;background:#FFF8E7;display:flex;flex-direction:column;font-family:'Nunito',sans-serif}
.ex-topbar{padding:.85rem 1.25rem;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ex-back{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#6B7280}
.ex-title{font-weight:800;font-size:1rem;color:#1E1B4B;font-family:'Nunito',sans-serif}
.ex-stars-count{background:#FFD93D;border-radius:50px;padding:.3rem .9rem;font-weight:800;font-size:.85rem;color:#1E1B4B}
.ex-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.ex-card{background:#fff;border-radius:24px;padding:1.75rem;width:100%;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.1);text-align:center}
.ex-instruction{font-weight:800;font-size:1.3rem;color:#1E1B4B;margin-bottom:1.25rem;font-family:'Nunito',sans-serif;line-height:1.3}
.ex-target{font-size:5rem;line-height:1;margin:.5rem 0}
.ex-word{font-weight:900;font-size:1.6rem;color:#A855F7;font-family:'Nunito',sans-serif;margin-top:.35rem}
.ex-options{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:1.25rem}
.ex-opt{background:#F3F4F6;border:3px solid transparent;border-radius:18px;padding:.9rem .5rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:.35rem;font-family:'Nunito',sans-serif}
.ex-opt:hover{background:#EDE9FE;border-color:#A855F7;transform:translateY(-2px)}
.ex-opt.correct{background:#DCFCE7;border-color:#22C55E}
.ex-opt.wrong{background:#FEE2E2;border-color:#EF4444;animation:ex-shake .4s}
.ex-opt.disabled{cursor:not-allowed;opacity:.6}
.ex-opt-emoji{font-size:2.6rem;line-height:1}
.ex-opt-word{font-size:.8rem;font-weight:800;color:#1E1B4B}
.ex-prog{display:flex;gap:6px;margin-bottom:1.25rem}
.ex-dot{width:11px;height:11px;border-radius:50%;background:#E5E7EB;transition:all .3s}
.ex-dot.done{background:#22C55E}
.ex-dot.cur{background:#A855F7;transform:scale(1.3)}
/* syllable */
.ex-syl-target{font-size:5rem;cursor:pointer;user-select:none;transition:transform .1s;line-height:1}
.ex-syl-target:active{transform:scale(.88)}
.ex-syl-dots{display:flex;gap:.5rem;min-height:46px;align-items:center;justify-content:center;margin:.75rem 0}
.ex-syl-dot{width:40px;height:40px;border-radius:50%;background:#A855F7;opacity:0;transform:scale(0);transition:all .2s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.ex-syl-dot.v{opacity:1;transform:scale(1)}
.ex-syl-btns{display:flex;gap:.65rem;justify-content:center;margin-top:.5rem}
.ex-syl-btn{padding:.65rem 1.25rem;border-radius:50px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer}
.ex-syl-ok{background:#22C55E;color:#fff}
.ex-syl-reset{background:#E5E7EB;color:#374151}
/* attention */
.ex-att-grid{display:grid;gap:.65rem;margin-top:1rem}
.ex-att-grid.g4{grid-template-columns:repeat(4,1fr)}
.ex-att-grid.g3{grid-template-columns:repeat(3,1fr)}
.ex-att-item{background:#F3F4F6;border:3px solid transparent;border-radius:16px;padding:.75rem;cursor:pointer;transition:all .2s;text-align:center;font-size:2.3rem;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.ex-att-item:hover{background:#EDE9FE;border-color:#A855F7}
.ex-att-item.correct{background:#DCFCE7;border-color:#22C55E}
.ex-att-item.wrong{background:#FEE2E2;border-color:#EF4444}
.ex-att-label{font-size:.65rem;font-weight:800;color:#6B7280;font-family:'Nunito',sans-serif}
/* celebration */
.ex-cel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:600}
.ex-cel-card{background:#fff;border-radius:28px;padding:2rem 1.75rem;text-align:center;max-width:300px;width:90%}
.ex-cel-emoji{font-size:4.5rem;margin-bottom:.65rem}
.ex-cel-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.8rem;color:#A855F7;margin-bottom:.4rem}
.ex-cel-sub{color:#6B7280;font-size:.85rem;margin-bottom:1rem;font-family:'Nunito',sans-serif;font-weight:600}
.ex-cel-btn{background:linear-gradient(135deg,#A855F7,#EC4899);color:#fff;border:none;border-radius:50px;padding:.85rem 1.75rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer}
/* finish */
.ex-finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);text-align:center;padding:2rem}
.ex-fin-emoji{font-size:5rem;margin-bottom:.75rem}
.ex-fin-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:2rem;color:#fff;margin-bottom:.4rem}
.ex-fin-sub{color:rgba(255,255,255,.75);margin-bottom:1.5rem;font-size:.9rem;font-family:'Nunito',sans-serif;font-weight:600}
.ex-fin-btn{background:#fff;color:#A855F7;border:none;border-radius:50px;padding:.9rem 2rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer}
@keyframes ex-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

function GatePage({onUnlock,settings}){

  const tryCode=()=>{
    setLoading(true);setErr('');
    setTimeout(()=>{
      const c=code.trim();
      const cUp=c.toUpperCase();
      if(proCodes.includes(c)||proCodes.includes(cUp)){onUnlock('pro',null,null);}
      else{
        const fc=familyCodes.find(f=>f.code===c||f.code===cUp);
        if(fc){
          if(fc.patientData){onUnlock('familia',null,fc.patientData);}
          else{onUnlock('familia',fc.patientId,null);}

function PacientesView({patients,setPatients,activeId,setActiveId}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState(null);
  const open=(p=null)=>setForm(p?{...p}:newPatient(''));
  const save=()=>{
    if(!form.name.trim())return;
    const savedId=form.id||uid();
    const savedForm={...form,id:savedId};
    setPatients(prev=>prev.find(p=>p.id===savedId)?prev.map(p=>p.id===savedId?savedForm:p):[...prev,savedForm]);
    if(!activeId)setActiveId(savedId);
    setForm(null);
  };
  const del=(id)=>{if(window.confirm('¿Eliminar este paciente y todos sus datos?')){setPatients(prev=>prev.filter(p=>p.id!==id));if(activeId===id)setActiveId(patients.filter(p=>p.id!==id)[0]?.id||null);}};
  const toggle=(id,field)=>setForm(f=>{const d=f[field]||[];return {...f,[field]:d.includes(id)?d.filter(x=>x!==id):[...d,id]};});
  return(
    <div className="content">
      <div className="flex-between" style={{marginBottom:'1.25rem'}}>
        <div><div style={{fontSize:'1.05rem',fontWeight:700}}>Gestión de pacientes</div><div className="text-sm" style={{marginTop:2}}>{patients.length} paciente{patients.length!==1?'s':''} registrado{patients.length!==1?'s':''}</div></div>

          <div style={{fontSize:'2rem',marginBottom:'1rem'}}>◉</div>
          <div style={{fontWeight:700,marginBottom:6}}>Sin pacientes aún</div>

          <button className="btn-sm btn-teal" onClick={()=>open()}>Crear primer paciente</button>
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1rem'}}>
          {patients.map(p=>{
            const done=p.sessions.A.filter(s=>s.done).length;

              <div key={p.id} className={`patient-card${activeId===p.id?' active-pat':''}`} onClick={()=>setActiveId(p.id)}>

                  </div>
                </div>
                <div className="pc-diag">{p.diagnosis.join(', ')||'Sin diagnóstico'}</div>
                <div className="pc-meta">Inicio: {fmtDate(p.startDate)} · {done}/16 sesiones</div>
                <div className="prog-bar" style={{margin:'.5rem 0 .25rem'}}><div className="prog-fill" style={{width:`${done/16*100}%`}}/></div>
                {activeId===p.id&&<div style={{fontSize:'.7rem',color:'var(--magenta)',fontWeight:700,marginTop:4}}>● Paciente activo</div>}
              </div>
            );
          })}
        </div>
      )}
      {form&&(
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setForm(null)}>
          <div className="modal" style={{maxWidth:600}}>

function SessionsView({patient,updatePatient}){

  if(!patient)return<div className="content"><div className="text-sm" style={{padding:'2rem',textAlign:'center'}}>Selecciona un paciente para gestionar las sesiones.</div></div>;
  const list=SESS_OBJ[track];
  const cur=patient.sessions[track];
  const done=cur.filter(s=>s.done).length;
  const update=(id,changes)=>updatePatient(p=>({...p,sessions:{...p.sessions,[track]:p.sessions[track].map(s=>s.id===id?{...s,...changes}:s)}}));
  return(
    <div className="content">
      <div className="flex-between" style={{marginBottom:'1rem'}}><div><div style={{fontSize:'1.05rem',fontWeight:700}}>Sesiones · {patient.name}</div><div className="text-sm" style={{marginTop:2}}>{done}/{list.length} completadas en Track {track}</div></div><span className="badge badge-tl">{Math.round(done/list.length*100)}%</span></div>
      <div className="prog-bar"><div className="prog-fill" style={{width:`${done/list.length*100}%`}}/></div>
      <div className="track-tabs">
        {['A','B','C'].map(t=><div key={t} className={`track-tab${track===t?' active':''}`} onClick={()=>setTrack(t)}>Track {t}{t==='A'?' — Clínico':t==='B'?' — Escolar':' — Monitor.'}</div>)}
      </div>
      <div className="sessions-grid">
        {list.map((s,i)=>{
          const st=cur.find(c=>c.id===s.id)||{done:false,note:''};
          const isCur=!st.done&&(i===0||(cur.find(c=>c.id===list[i-1]?.id)||{}).done);
          return(
            <div key={s.id} className={`sess${st.done?' done':isCur?' current':''}`} onClick={()=>setModal({...s,...st,track})}>
              <div className="sess-num">Sesión {s.id}</div>
              <div className="sess-title">{s.obj.substring(0,42)}{s.obj.length>42?'…':''}</div>
              <div className="sess-status">{st.done?'✓ Completada':isCur?'● En curso':'○ Pendiente'}</div>

        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(null)}>

            <div className="flex-row mt1">
              <button className="btn-sm btn-teal" onClick={()=>{const note=document.getElementById('sess-note').value;update(modal.id,{done:!modal.done,note,date:!modal.done?new Date().toISOString().slice(0,10):modal.date});setModal(null);}}>{modal.done?'Marcar pendiente':'Marcar completada'}</button>

            </div>
          </div>
        </div>
      )}

  );

  },[input,loading,msgs,apiKey,patient]);

      <div className="flex-between" style={{marginBottom:'.85rem'}}>
        <div><div style={{fontSize:'1.05rem',fontWeight:700}}>Asistente Clínico IA</div><div className="text-sm">Orientación clínica con el protocolo HoloNeuro TND® y razonamiento HoloSemiótico.</div></div>
        <button className="btn-sm btn-outline" style={{fontSize:'.72rem'}} onClick={()=>setShowKey(v=>!v)}>API Key</button>
      </div>
      {showKey&&<div style={{background:'var(--navy10)',borderRadius:8,padding:'1rem',marginBottom:'.85rem'}}><div className="text-sm" style={{marginBottom:'.5rem'}}>Introduce tu API Key de Anthropic para activar el asistente.</div><div className="flex-row"><input className="inp" style={{marginBottom:0,flex:1}} type="password" placeholder="sk-ant-..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/><button className="btn-sm btn-teal" onClick={saveKey}>Guardar</button></div><div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:6}}>Guardada localmente. Nunca se envía a servidores UNIMED.</div></div>}
      <div className="chat-wrap">
        <div className="chat-msgs">
          {msgs.map((m,i)=><div key={i} className={`msg ${m.role}`}>{m.role==='ai'&&<div className="msg-role">HoloNeuro Asistente</div>}<div style={{whiteSpace:'pre-wrap'}}>{m.text}</div></div>)}
          {loading&&<div className="msg ai"><div className="msg-role">HoloNeuro Asistente</div><div className="loading-dots"><span/><span/><span/></div></div>}
          <div ref={endRef}/>
        </div>
        <div className="chat-input-row">
          <textarea placeholder="Pregunta sobre el protocolo, un caso clínico, estrategias TND…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}/>
          <button className="btn-sm btn-teal" onClick={send} disabled={loading||!input.trim()} style={{alignSelf:'flex-end',padding:'10px 16px'}}>Enviar →</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ CONFIG ════════════════════════════════════ */
function ConfigView({settings,setSettings,patients,setPatients}){
  const [extraCode,setExtraCode]=useState('');
  const [famCode,setFamCode]=useState('');
  const [famPat,setFamPat]=useState('');
  const [showExPanel,setShowExPanel]=useState(false);
  const [newEx,setNewEx]=useState({tipo:'rimas',emoji:'',palabra:'',rima1:'',rima1emoji:'',rima2:'',rima2emoji:'',silabas:2,sonido:''});
  const customExs=settings.customExercises||[];

  const addCode=()=>{const c=extraCode.trim().toUpperCase();if(c&&!settings.extraCodes?.includes(c)){setSettings(s=>({...s,extraCodes:[...(s.extraCodes||[]),c]}));setExtraCode('');}};
  const removeCode=(c)=>setSettings(s=>({...s,extraCodes:(s.extraCodes||[]).filter(x=>x!==c)}));
  const addFamCode=()=>{
    const c=famCode.trim().toUpperCase();
    if(!c||!famPat)return;
    const p=patients.find(x=>x.id===famPat);
    if(!p)return;
    const fc={code:c,patientId:p.id,patientName:p.name};
    setSettings(s=>({...s,familyCodes:[...(s.familyCodes||[]).filter(x=>x.code!==c),fc]}));
    setFamCode('');setFamPat('');
  };
  const removeFamCode=(c)=>setSettings(s=>({...s,familyCodes:(s.familyCodes||[]).filter(x=>x.code!==c)}));
  const removeCustomEx=(i)=>setSettings(s=>({...s,customExercises:(s.customExercises||[]).filter((_,j)=>j!==i)}));
  const addCustomEx=()=>{
    if(!newEx.palabra&&!newEx.sonido)return alert('Rellena al menos la palabra o sonido del ejercicio.');
    const ex={...newEx,id:'cx_'+uid()};
    setSettings(s=>({...s,customExercises:[...(s.customExercises||[]),ex]}));
    setNewEx({tipo:'rimas',emoji:'',palabra:'',rima1:'',rima1emoji:'',rima2:'',rima2emoji:'',silabas:2,sonido:''});
    alert('✅ Ejercicio añadido. Aparecerá en las próximas sesiones de entrenamiento.');
  };
  const exportData=()=>{
    const data=JSON.stringify({patients,settings,exported:new Date().toISOString()});
    const a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
    a.download=`holoneuro-backup-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;
    a.click();
  };
  const importData=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=(ev)=>{try{const d=JSON.parse(ev.target.result);if(d.patients)setPatients(d.patients);if(d.settings)setSettings(d.settings);alert('Datos restaurados correctamente.');}catch{alert('Error al leer el archivo.');}};
    r.readAsText(file);
  };
  return(
    <div className="content">
      <div style={{marginBottom:'1.25rem'}}><div style={{fontSize:'1.05rem',fontWeight:700}}>Configuración</div><div className="text-sm" style={{marginTop:2}}>HoloNeuro TND® v9.1 · Gestiona accesos, ejercicios y ajustes.</div></div>

      {/* PANEL EJERCICIOS PERSONALIZADOS */}
      <div className="config-section" style={{borderLeft:'4px solid var(--gold)'}}>
        <div className="flex-between" style={{marginBottom:'.65rem'}}>
          <div className="config-title" style={{marginBottom:0}}>🎯 Añadir ejercicios personalizados</div>
          <button className="btn-sm btn-gold" onClick={()=>setShowExPanel(v=>!v)}>{showExPanel?'Cerrar':'+ Nuevo ejercicio'}</button>
        </div>
        <div className="text-sm" style={{marginBottom:'.75rem'}}>Añade ejercicios sin tocar el código. Se integran automáticamente en el entrenamiento.</div>

        {showExPanel&&(
          <div style={{background:'var(--gold10)',border:'1px solid var(--gold)',borderRadius:8,padding:'1rem',marginBottom:'1rem'}}>
            <div style={{marginBottom:'.75rem'}}>
              <label className="field-label">Tipo de ejercicio</label>
              <select className="inp" style={{marginBottom:0}} value={newEx.tipo} onChange={e=>setNewEx(x=>({...x,tipo:e.target.value}))}>
                <option value="rimas">🎵 Rima — Encuentra qué palabras riman</option>
                <option value="silabas">👏 Sílabas — Cuenta las partes de la palabra</option>
                <option value="sonido">🔤 Primer Sonido — ¿Con qué letra empieza?</option>
              </select>
            </div>
            {newEx.tipo==='rimas'&&(
              <div>
                <div className="field-grid">
                  <div><label className="field-label">Emoji objetivo</label><input className="inp" style={{marginBottom:0}} placeholder="🌞" value={newEx.emoji} onChange={e=>setNewEx(x=>({...x,emoji:e.target.value}))}/></div>
                  <div><label className="field-label">Palabra objetivo (mayúsculas)</label><input className="inp" style={{marginBottom:0}} placeholder="SOL" value={newEx.palabra} onChange={e=>setNewEx(x=>({...x,palabra:e.target.value.toUpperCase()}))}/></div>
                </div>
                <div className="field-grid" style={{marginTop:'.5rem'}}>
                  <div><label className="field-label">Opción 1 emoji</label><input className="inp" style={{marginBottom:4}} placeholder="🥦" value={newEx.rima1emoji} onChange={e=>setNewEx(x=>({...x,rima1emoji:e.target.value}))}/><input className="inp" style={{marginBottom:0}} placeholder="Palabra 1 (RIMA ✓)" value={newEx.rima1} onChange={e=>setNewEx(x=>({...x,rima1:e.target.value.toUpperCase()}))}/></div>
                  <div><label className="field-label">Opción 2 emoji</label><input className="inp" style={{marginBottom:4}} placeholder="🍞" value={newEx.rima2emoji} onChange={e=>setNewEx(x=>({...x,rima2emoji:e.target.value}))}/><input className="inp" style={{marginBottom:0}} placeholder="Palabra 2 (no rima)" value={newEx.rima2} onChange={e=>setNewEx(x=>({...x,rima2:e.target.value.toUpperCase()}))}/></div>
                </div>
                <div className="text-sm" style={{marginTop:'.5rem',color:'var(--text3)'}}>💡 La opción 1 será la respuesta correcta (rima). La opción 2 será el distractor.</div>
              </div>
            )}
            {newEx.tipo==='silabas'&&(
              <div className="field-grid">
                <div><label className="field-label">Emoji</label><input className="inp" style={{marginBottom:0}} placeholder="🐱" value={newEx.emoji} onChange={e=>setNewEx(x=>({...x,emoji:e.target.value}))}/></div>
                <div><label className="field-label">Palabra (mayúsculas)</label><input className="inp" style={{marginBottom:0}} placeholder="GATO" value={newEx.palabra} onChange={e=>setNewEx(x=>({...x,palabra:e.target.value.toUpperCase()}))}/></div>
                <div><label className="field-label">Número de sílabas</label><input className="inp" style={{marginBottom:0}} type="number" min={1} max={6} value={newEx.silabas} onChange={e=>setNewEx(x=>({...x,silabas:Number(e.target.value)}))}/></div>
              </div>
            )}
            {newEx.tipo==='sonido'&&(
              <div className="field-grid">
                <div><label className="field-label">Letra / Sonido</label><input className="inp" style={{marginBottom:0}} placeholder="M" value={newEx.sonido} onChange={e=>setNewEx(x=>({...x,sonido:e.target.value.toUpperCase()}))}/></div>
                <div><label className="field-label">Emoji + Palabra correcta</label><div style={{display:'flex',gap:6}}><input className="inp" style={{marginBottom:0,width:70}} placeholder="🍈" value={newEx.emoji} onChange={e=>setNewEx(x=>({...x,emoji:e.target.value}))}/><input className="inp" style={{marginBottom:0}} placeholder="MELÓN" value={newEx.palabra} onChange={e=>setNewEx(x=>({...x,palabra:e.target.value.toUpperCase()}))}/></div></div>
              </div>
            )}
            <button className="btn-sm btn-gold" style={{marginTop:'.85rem'}} onClick={addCustomEx}>Añadir ejercicio →</button>
          </div>
        )}

        {customExs.length>0&&(
          <div>
            <div className="text-sm" style={{fontWeight:600,marginBottom:'.5rem'}}>{customExs.length} ejercicio{customExs.length!==1?'s':''} añadido{customExs.length!==1?'s':''}:</div>
            {customExs.map((ex,i)=>(
              <div key={i} className="config-ex-item">
                <span>{EX_META[ex.tipo]?.icon} <strong>{ex.palabra||ex.sonido}</strong> · {EX_META[ex.tipo]?.name}</span>
                <button className="btn-sm btn-outline" style={{padding:'2px 8px',fontSize:'.7rem',color:'var(--magenta)'}} onClick={()=>removeCustomEx(i)}>✕ Eliminar</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="config-section" style={{borderLeft:'4px solid var(--magenta)'}}>
        <div className="config-title">👨‍👩‍👧 Códigos de acceso para familias</div>
        <div className="text-sm" style={{marginBottom:'.75rem'}}>Crea un código para que los padres accedan solo a los ejercicios de su hijo/a. Ven también el Programa de Verano. No verán datos clínicos.</div>
        <div className="field-grid" style={{marginBottom:'.75rem'}}>
          <div><label className="field-label">Código familiar</label><input className="inp" style={{marginBottom:0}} placeholder="ej. VICTORIA-CASA" value={famCode} onChange={e=>setFamCode(e.target.value)}/></div>
          <div><label className="field-label">Paciente vinculado</label><select className="inp" style={{marginBottom:0}} value={famPat} onChange={e=>setFamPat(e.target.value)}><option value="">Seleccionar paciente…</option>{patients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        </div>
        <button className="btn-sm btn-mg" onClick={addFamCode} disabled={!famCode||!famPat}>Crear código familiar</button>
        {(settings.familyCodes||[]).length>0&&(
          <div style={{marginTop:'.75rem'}}>
            <div className="text-sm" style={{fontWeight:600,marginBottom:6}}>Códigos activos:</div>
            {(settings.familyCodes||[]).map(fc=>(
              <div key={fc.code} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 10px',background:'var(--magenta10)',borderRadius:6,marginBottom:4,fontSize:'.82rem'}}>
                <span><strong>{fc.code}</strong> → {fc.patientName}</span>
                <button className="btn-sm btn-outline" style={{padding:'2px 8px',fontSize:'.7rem',color:'var(--magenta)'}} onClick={()=>removeFamCode(fc.code)}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="config-section" style={{borderLeft:'4px solid var(--teal)'}}>
        <div className="config-title">💾 Copia de seguridad</div>
        <div className="text-sm" style={{marginBottom:'.75rem'}}>Exporta regularmente. Si el navegador pierde los datos, restaura desde aquí.</div>
        <div className="flex-row">
          <button className="btn-sm btn-teal" onClick={exportData}>📥 Exportar backup (.json)</button>
          <label className="btn-sm btn-outline" style={{cursor:'pointer'}}>
            📂 Restaurar backup
            <input type="file" accept=".json" style={{display:'none'}} onChange={importData}/>
          </label>
        </div>
        <div className="text-sm" style={{marginTop:8}}>Pacientes guardados: <strong>{patients.length}</strong></div>
      </div>

      <div className="config-section">
        <div className="config-title">🔗 Stripe — Enlace de pago</div>
        <label className="field-label">URL del Payment Link de Stripe</label>
        <input className="inp" placeholder="https://buy.stripe.com/xxxx..." value={settings.stripeUrl||''} onChange={e=>setSettings(s=>({...s,stripeUrl:e.target.value}))}/>
        <div className="text-sm" style={{marginTop:4}}>💡 Precio 97€ · Nombre: "HoloNeuro TND® — Acceso anual"</div>
      </div>

      <div className="config-section">
        <div className="config-title">🔑 Códigos de acceso profesional</div>
        <div style={{marginBottom:'.75rem'}}>
          {DEFAULT_CODES.map(c=><span key={c} className="code-pill">{c}</span>)}
        </div>
        {(settings.extraCodes||[]).length>0&&<div style={{marginBottom:'.75rem'}}>{(settings.extraCodes||[]).map(c=><span key={c} className="code-pill" style={{cursor:'pointer'}} onClick={()=>removeCode(c)}>{c} ✕</span>)}</div>}
        <div className="flex-row">
          <input className="inp" style={{marginBottom:0,flex:1}} placeholder="Nuevo código profesional" value={extraCode} onChange={e=>setExtraCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCode()}/>
          <button className="btn-sm btn-teal" onClick={addCode}>Añadir</button>
        </div>
      </div>

      <div className="config-section">
        <div className="config-title">📧 Datos de contacto</div>
        {[['contactEmail','Email de contacto','samuel@unimed-consulting.es'],['contactPhone','Teléfono',''],['website','Web','unimed-consulting.es']].map(([k,l,ph])=>(
          <div key={k} style={{marginBottom:'.65rem'}}><label className="field-label">{l}</label><input className="inp" style={{marginBottom:0}} placeholder={ph} value={settings[k]||''} onChange={e=>setSettings(s=>({...s,[k]:e.target.value}))}/></div>
        ))}
      </div>
    </div>
  );
}

const DIAG_EXERCISES={
  'Trastorno del Lenguaje':['rimas','silabas','sonido','atencion'],
  'TDAH':['atencion','silabas'],
  'TEA Nivel 1':['atencion','rimas'],
  'TEA Nivel 2':['atencion'],
  'Dislexia':['rimas','silabas','sonido'],
  'TPS':['atencion'],
  'TPA':['sonido','silabas'],
  'default':['atencion','rimas'],
};

const EX_META={
  rimas:{icon:'🎵',name:'Rimas',desc:'¿Qué palabras suenan igual?',col:'c1',count:EX_RIMAS.length},
  silabas:{icon:'👏',name:'Sílabas',desc:'Cuenta las partes de la palabra',col:'c2',count:EX_SILABAS.length},
  sonido:{icon:'🔤',name:'Primer Sonido',desc:'¿Con qué letra empieza?',col:'c3',count:EX_SONIDO.length},
  atencion:{icon:'👁️',name:'¡Atento!',desc:'¿Cuál es diferente?',col:'c4',count:EX_ATENCION.length},
};

/* ── SPEECH SYNTHESIS ────────────────────── */
const speak=(text,rate=0.82,pitch=1.1)=>{
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-ES';u.rate=rate;u.pitch=pitch;
  window.speechSynthesis.speak(u);
};
const speakDelay=(text,ms=300)=>setTimeout(()=>speak(text),ms);
const shuffle=arr=>[...arr].sort(()=>Math.random()-.5);

/* ── EXERCISE SUBCOMPONENTS ──────────────── */
function ExCelebration({onNext,isLast,msg}){
  const msgs=[['¡GENIAL!','¡Lo hiciste muy bien!'],['¡BRAVO!','¡Eres una campeona!'],['¡PERFECTO!','¡Qué lista eres!'],['¡INCREÍBLE!','¡Sigue así!']];
  const [[t,s]]=useState(()=>[msgs[Math.floor(Math.random()*msgs.length)]]);
  useEffect(()=>{ speak(s,0.8,1.2); },[]);
  return(
    <div className="ex-cel">
      <div className="ex-cel-card">
        <div className="ex-cel-emoji">⭐</div>
        <div className="ex-cel-title">{t}</div>
        <div className="ex-cel-sub">{s} 🎉</div>
        <button className="ex-cel-btn" onClick={onNext}>{isLast?'¡Terminar! 🎊':'¡Siguiente! →'}</button>
      </div>
    </div>
  );
}

function ExRimas({onFinish}){
  const [exercises]=useState(()=>shuffle(EX_RIMAS).slice(0,6));
  const [idx,setIdx]=useState(0);const [sel,setSel]=useState([]);const [state,setState]=useState('idle');const [cel,setCel]=useState(false);const [stars,setStars]=useState(0);
  const q=exercises[idx];const isLast=idx===exercises.length-1;
  useEffect(()=>{ speakDelay(`¿Qué rima con ${q.tword}?`,400); },[idx]);
  const pick=(i)=>{
    if(state!=='idle')return;
    speak(q.opts[i].w);
    const ns=[...sel,i];setSel(ns);
    if(ns.length===q.correct.length){const ok=q.correct.every(c=>ns.includes(c));setState(ok?'correct':'wrong');if(ok){setStars(s=>s+1);setTimeout(()=>setCel(true),400);}else{speak('Inténtalo otra vez',0.8,1.0);setTimeout(()=>{setSel([]);setState('idle');},1200);}}
  };
  const next=()=>{setCel(false);setState('idle');setSel([]);if(isLast)onFinish(stars+1);else setIdx(i=>i+1);};
  return(<>
    <div className="ex-prog">{exercises.map((_,i)=><div key={i} className={`ex-dot${i<idx?' done':i===idx?' cur':''}`}/>)}</div>
    <div className="ex-card">
      <div className="ex-instruction">¿Qué palabras riman con…?</div>
      <div className="ex-target">{q.target}</div><div className="ex-word">{q.tword}</div>
      <div className="ex-options">{q.opts.map((o,i)=>{const isSel=sel.includes(i);const cls=isSel?(state==='correct'&&q.correct.includes(i)?'correct':state==='wrong'?'wrong':''):'';return(<button key={i} className={`ex-opt${cls?' '+cls:''}${state!=='idle'?' disabled':''}`} onClick={()=>pick(i)}><span className="ex-opt-emoji">{o.e}</span><span className="ex-opt-word">{o.w}</span></button>);})}</div>
      <div style={{fontSize:'.75rem',color:'#6B7280',marginTop:'.75rem',fontFamily:'Nunito,sans-serif',fontWeight:600}}>Toca {q.correct.length} que rimen 👆</div>
    </div>
    {cel&&<ExCelebration onNext={next} isLast={isLast}/>}
  </>);
}

function ExSilabas({onFinish}){
  const [exercises]=useState(()=>shuffle(EX_SILABAS).slice(0,6));
  const [idx,setIdx]=useState(0);const [taps,setTaps]=useState(0);const [state,setState]=useState('idle');const [cel,setCel]=useState(false);const [stars,setStars]=useState(0);
  const q=exercises[idx];const isLast=idx===exercises.length-1;
  useEffect(()=>{ speakDelay(q.w,400); },[idx]);
  const tap=()=>{
    if(state!=='idle')return;
    const n=taps;setTaps(t=>t+1);
    if(q.syl[n])speak(q.syl[n],0.75,1.1);
  };
  const confirm=()=>{if(!taps)return;const ok=taps===q.s;setState(ok?'correct':'wrong');if(ok){speak(q.syl.join('... '),0.7,1.1);setStars(s=>s+1);setTimeout(()=>setCel(true),600);}else{speak('Inténtalo otra vez',0.8,1.0);setTimeout(()=>{setTaps(0);setState('idle');},1200);}};
  const next=()=>{setCel(false);setState('idle');setTaps(0);if(isLast)onFinish(stars+1);else setIdx(i=>i+1);};
  return(<>
    <div className="ex-prog">{exercises.map((_,i)=><div key={i} className={`ex-dot${i<idx?' done':i===idx?' cur':''}`}/>)}</div>
    <div className="ex-card">
      <div className="ex-instruction">Toca al ritmo de las sílabas 👇</div>
      <div className="ex-syl-target" onClick={tap}>{q.e}</div>
      <div className="ex-word">{q.w}</div>
      <div className="ex-syl-dots">{Array.from({length:Math.max(taps,q.s)},(_,i)=><div key={i} className={`ex-syl-dot${i<taps?' v':''}`}>{i+1}</div>)}</div>
      <div style={{fontSize:'.78rem',color:'#6B7280',fontFamily:'Nunito,sans-serif',fontWeight:600}}>{taps} palmada{taps!==1?'s':''}</div>
      <div className="ex-syl-btns">
        <button className="ex-syl-btn ex-syl-ok" onClick={confirm} disabled={!taps||state!=='idle'}>¡Listo! ✓</button>
        <button className="ex-syl-btn ex-syl-reset" onClick={()=>{setTaps(0);setState('idle');}}>↺ Borrar</button>
      </div>
      {state==='correct'&&<div style={{color:'#22C55E',fontWeight:800,marginTop:'.5rem',fontFamily:'Nunito,sans-serif'}}>✅ ¡Correcto! {q.syl.join(' · ')}</div>}
      {state==='wrong'&&<div style={{color:'#EF4444',fontWeight:800,marginTop:'.5rem',fontFamily:'Nunito,sans-serif'}}>❌ Prueba otra vez</div>}
    </div>
    {cel&&<ExCelebration onNext={next} isLast={isLast}/>}
  </>);
}

function ExSonido({onFinish}){
  const [exercises]=useState(()=>shuffle(EX_SONIDO).slice(0,5));
  const [idx,setIdx]=useState(0);const [sel,setSel]=useState(null);const [state,setState]=useState('idle');const [cel,setCel]=useState(false);const [stars,setStars]=useState(0);
  const q=exercises[idx];const isLast=idx===exercises.length-1;
  useEffect(()=>{ speakDelay(`¿Cuál empieza con... ${q.sound}? ${q.sound}`,400); },[idx]);
  const pick=(i)=>{
    if(state!=='idle')return;
    speak(q.opts[i].w);
    setSel(i);const ok=i===q.correct;setState(ok?'correct':'wrong');
    if(ok){setStars(s=>s+1);setTimeout(()=>setCel(true),400);}
    else{speak('Inténtalo otra vez',0.8,1.0);setTimeout(()=>{setSel(null);setState('idle');},1200);}
  };
  const next=()=>{setCel(false);setState('idle');setSel(null);if(isLast)onFinish(stars+1);else setIdx(i=>i+1);};
  return(<>
    <div className="ex-prog">{exercises.map((_,i)=><div key={i} className={`ex-dot${i<idx?' done':i===idx?' cur':''}`}/>)}</div>
    <div className="ex-card">
      <div className="ex-instruction">¿Cuál empieza con…?</div>
      <div style={{fontSize:'4.5rem',fontWeight:900,color:'#A855F7',fontFamily:'Nunito,sans-serif',margin:'.5rem 0 1.25rem',lineHeight:1}}>{q.sound}</div>
      <div className="ex-options">{q.opts.map((o,i)=>{const cls=sel===i?(state==='correct'?'correct':'wrong'):'';return(<button key={i} className={`ex-opt${cls?' '+cls:''}${state!=='idle'?' disabled':''}`} onClick={()=>pick(i)}><span className="ex-opt-emoji">{o.e}</span><span className="ex-opt-word">{o.w}</span></button>);})}</div>
    </div>
    {cel&&<ExCelebration onNext={next} isLast={isLast}/>}
  </>);
}

function ExAtencion({onFinish}){
  const [exercises]=useState(()=>shuffle(EX_ATENCION).slice(0,5));
  const [idx,setIdx]=useState(0);const [sel,setSel]=useState(null);const [state,setState]=useState('idle');const [cel,setCel]=useState(false);const [stars,setStars]=useState(0);
  const q=exercises[idx];const isLast=idx===exercises.length-1;
  useEffect(()=>{ speakDelay(q.instr,400); },[idx]);
  const pick=(i)=>{
    if(state!=='idle')return;
    if(q.items[i].l)speak(q.items[i].l);
    setSel(i);const ok=i===q.odd;setState(ok?'correct':'wrong');
    if(ok){setStars(s=>s+1);setTimeout(()=>setCel(true),400);}
    else{speak('Prueba otra vez',0.8,1.0);setTimeout(()=>{setSel(null);setState('idle');},1200);}
  };
  const next=()=>{setCel(false);setState('idle');setSel(null);if(isLast)onFinish(stars+1);else setIdx(i=>i+1);};
  return(<>
    <div className="ex-prog">{exercises.map((_,i)=><div key={i} className={`ex-dot${i<idx?' done':i===idx?' cur':''}`}/>)}</div>
    <div className="ex-card">
      <div className="ex-instruction">{q.instr}</div>
      <div className={`ex-att-grid${q.items.length===3?' g3':' g4'}`}>{q.items.map((it,i)=>{const cls=sel===i?(state==='correct'?'correct':'wrong'):'';return(<div key={i} className={`ex-att-item${cls?' '+cls:''}${state!=='idle'?' disabled':''}`} onClick={()=>pick(i)}><span>{it.e}</span>{it.l&&<span className="ex-att-label">{it.l}</span>}</div>);})}</div>
    </div>
    {cel&&<ExCelebration onNext={next} isLast={isLast}/>}
  </>);
}

function ExerciseOverlay({type,patientName,onClose,onComplete,totalStars=0}){
  const [finished,setFinished]=useState(false);
  const [finStars,setFinStars]=useState(0);
  const [soundReady,setSoundReady]=useState(false);
  const meta=EX_META[type];
  const nivel=getNivel(totalStars);
  const total={rimas:EX_RIMAS.length,silabas:EX_SILABAS.length,sonido:EX_SONIDO.length,atencion:EX_ATENCION.length}[type];

  const activateSound=()=>{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('Lista');
    u.lang='es-ES';u.rate=0.82;u.pitch=1.1;u.volume=0.01;
    window.speechSynthesis.speak(u);
    setSoundReady(true);
  };

  const finish=(s)=>{
    setFinStars(s);setFinished(true);
    const msg=s>=total*0.8?'¡Campeona! ¡Lo hiciste genial!':s>=total*0.6?'¡Muy bien! ¡Buen trabajo!':'¡Buen trabajo! ¡Sigue practicando!';
    speakDelay(msg,300);
  };
  const exComponents={
    rimas:<ExRimas onFinish={finish}/>,
    silabas:<ExSilabas onFinish={finish}/>,
    sonido:<ExSonido onFinish={finish}/>,
    atencion:<ExAtencion onFinish={finish}/>,
  };
  return(
    <div className="ex-overlay">
      <div className="ex-topbar">
        <button className="ex-back" onClick={()=>{window.speechSynthesis.cancel();onClose();}}>← Volver</button>
        <div className="ex-title">{meta.icon} {meta.name} · {patientName}</div>
        <div className="ex-stars-count">{nivel.emoji} {totalStars} ⭐</div>
      </div>
      {!soundReady?(
        <div className="ex-body">
          <div className="ex-card" style={{textAlign:'center',maxWidth:400}}>
            <div style={{fontSize:'4rem',marginBottom:'1rem'}}>🔊</div>
            <div style={{fontFamily:'Nunito,sans-serif',fontWeight:900,fontSize:'1.5rem',color:'#1E1B4B',marginBottom:'.5rem'}}>{meta.icon} {meta.name}</div>
            <div style={{background:nivel.bg,color:nivel.color,borderRadius:12,padding:'.65rem 1rem',marginBottom:'1rem',fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'.85rem'}}>
              {nivel.emoji} Nivel {nivel.nivel}: {nivel.nombre} · {nivel.desc}
            </div>
            <div style={{fontFamily:'Nunito,sans-serif',fontSize:'.85rem',color:'#6B7280',marginBottom:'1.5rem',lineHeight:1.6}}>Toca el botón para activar el sonido y empezar.</div>
            <button onClick={activateSound} style={{background:'linear-gradient(135deg,#A855F7,#EC4899)',color:'#fff',border:'none',borderRadius:50,padding:'1rem 2.5rem',fontFamily:'Nunito,sans-serif',fontWeight:900,fontSize:'1.1rem',cursor:'pointer',width:'100%'}}>
              🔊 ¡Activar sonido y empezar!
            </button>
          </div>
        </div>
      ):finished?(
        <div className="ex-finish">
          <div className="ex-fin-emoji">🏆</div>
          <div className="ex-fin-title">{finStars>=total*0.8?'¡Campeona!':finStars>=total*0.6?'¡Muy bien!':'¡Buen trabajo!'}</div>
          <div className="ex-fin-sub">{patientName} consiguió {finStars}/{total} estrellas en {meta.name}</div>
          <div style={{fontSize:'2rem',margin:'1rem 0'}}>{'⭐'.repeat(Math.min(finStars,8))}</div>
          <button className="ex-fin-btn" onClick={()=>{window.speechSynthesis.cancel();onComplete(finStars,type);}}>Volver a la plataforma →</button>
        </div>
      ):(
        <div className="ex-body">{exComponents[type]}</div>
      )}
    </div>
  );
}

/* ── ENTRENAMIENTO VIEW v9.1 — CON NIVELES ── */
function EntrenamientoView({patient,updatePatient}){
  const [active,setActive]=useState(null);
  const [sessionStars,setSessionStars]=useState(0);
  const totalStars=ls(`hn_stars_${patient?.id}`,0);
  const [totalState,setTotalState]=useState(totalStars);

  if(!patient)return<div className="content"><div style={{textAlign:'center',padding:'3rem',color:'var(--text3)'}}><div style={{fontSize:'2rem',marginBottom:8}}>🎮</div><div style={{fontWeight:700}}>Sin paciente activo</div></div></div>;

  const diags=patient.diagnosis||[];
  let exIds=[];
  diags.forEach(d=>{const list=DIAG_EXERCISES[d];if(list)list.forEach(e=>{if(!exIds.includes(e))exIds.push(e);});});
  if(!exIds.length)exIds=DIAG_EXERCISES['default'];

  const nivel=getNivel(totalState);
  const nextNivel=getNextNivel(totalState);

  const onComplete=(stars,type)=>{
    const newTotal=totalState+stars;
    setSessionStars(s=>s+stars);
    setTotalState(newTotal);
    lsSet(`hn_stars_${patient.id}`,newTotal);
    setActive(null);
    updatePatient(p=>({...p,sessions:{...p.sessions,A:p.sessions.A.map(s=>{const cur=p.sessions.A.find(x=>!x.done);return s.id===cur?.id?{...s,note:(s.note?s.note+'\n':'')+`Entrenamiento ${EX_META[type].name}: ${stars}⭐ (total: ${newTotal}⭐)`}:s;})}}));
  };

  return(
    <>
      {active&&<ExerciseOverlay type={active} patientName={patient.name.split(' ')[0]} totalStars={totalState} onClose={()=>setActive(null)} onComplete={onComplete}/>}
      <div className="content">
        <div className="ent-header">
          <div>
            <div className="ent-title">🎮 Entrenamiento Personalizado</div>
            <div className="ent-sub">{patient.name} · {patient.diagnosis.join(', ')||'TND'}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="ent-stars">⭐ {totalState} total</div>
            <div style={{fontSize:'.75rem',color:'rgba(255,255,255,.7)',marginTop:3}}>{nivel.emoji} {nivel.nombre}</div>
          </div>
        </div>

        {/* NIVEL ACTUAL */}
        <div style={{background:nivel.bg,border:`2px solid ${nivel.color}`,borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontWeight:800,color:nivel.color,fontSize:'1rem'}}>{nivel.emoji} Nivel {nivel.nivel}: {nivel.nombre}</div>
            <div style={{fontSize:'.78rem',color:nivel.color,opacity:.8,marginTop:2}}>{nivel.desc}</div>
            {nextNivel&&<div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>Próximo: {nextNivel.emoji} {nextNivel.nombre} en {nextNivel.min-totalState} ⭐ más</div>}
          </div>
          {sessionStars>0&&<div style={{background:nivel.color,color:'#fff',borderRadius:50,padding:'.4rem 1rem',fontWeight:800}}>+{sessionStars} hoy</div>}
        </div>

        {nextNivel&&(
          <div style={{marginBottom:'1.25rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',color:'var(--text3)',marginBottom:4}}>
              <span>{nivel.emoji} {nivel.nombre}</span><span>{nextNivel.emoji} {nextNivel.nombre} ({nextNivel.min} ⭐)</span>
            </div>
            <div style={{height:8,background:'var(--border)',borderRadius:4,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${Math.min(100,((totalState-nivel.min)/(nextNivel.min-nivel.min))*100)}%`,background:`linear-gradient(90deg,${nivel.color},${nextNivel.color})`,borderRadius:4,transition:'width .5s'}}/>
            </div>
          </div>
        )}

        <div className="ent-grid">
          {exIds.map(id=>{const m=EX_META[id];return(
            <div key={id} className={`ent-card ${m.col}`}>
              <div className="ent-icon">{m.icon}</div>
              <div className="ent-name">{m.name}</div>
              <div className="ent-desc">{m.desc}</div>
              <div className="ent-count">{m.count} ejercicios</div>
              <div className={`nivel-badge nivel-${nivel.nivel}`}>{nivel.emoji} Nivel {nivel.nivel}</div>
              <button className="ent-launch" onClick={()=>setActive(id)}>▶ Lanzar en sesión</button>
            </div>
          );})}
        </div>

        <div className="card" style={{background:'var(--navy)',color:'#fff',marginTop:'1rem'}}>
          <div style={{fontWeight:700,marginBottom:'.75rem',fontSize:'.9rem'}}>🏅 Sistema de niveles</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'.5rem',marginBottom:'.75rem'}}>
            {NIVELES.map(n=>(
              <div key={n.nivel} style={{background:totalState>=n.min?n.bg:'rgba(255,255,255,.05)',borderRadius:8,padding:'.6rem',textAlign:'center',border:nivel.nivel===n.nivel?`2px solid ${n.color}`:'2px solid transparent'}}>
                <div style={{fontSize:'1.4rem'}}>{n.emoji}</div>
                <div style={{fontSize:'.68rem',fontWeight:800,color:totalState>=n.min?n.color:'rgba(255,255,255,.3)',marginTop:2}}>{n.nombre}</div>
                <div style={{fontSize:'.6rem',color:'rgba(255,255,255,.4)',marginTop:1}}>{n.min}+ ⭐</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:'.78rem',color:'rgba(255,255,255,.6)',lineHeight:1.7}}>
            Cada nivel desbloquea más ejercicios por sesión. Los padres también ven el nivel en su acceso familiar con el código VICTORIA-CASA.
          </div>
        </div>
      </div>
    </>
  );
}

          <span className="verano-badge">🎯 TDL · Conciencia fonológica</span>
          <span className="verano-badge">🏫 Transición a Primaria</span>
          <span className="verano-badge">👨‍👩‍👧 Guiado por padres</span>
          <span className="verano-badge">⏱️ 15–25 min/día</span>
        </div>
      </div>
      <div className="card" style={{marginBottom:'1.25rem',background:'var(--gold10)',border:'1px solid var(--gold)'}}>
        <div style={{fontWeight:700,fontSize:'.9rem',marginBottom:'.5rem'}}>📋 Instrucciones para los padres</div>
        <div style={{fontSize:'.82rem',color:'var(--text2)',lineHeight:1.8}}>
          • <strong>Frecuencia:</strong> 4–5 días a la semana, máximo 25 min por sesión.<br/>
          • <strong>Plataforma:</strong> Los padres acceden con VICTORIA-CASA y ven este programa con actividades del día.<br/>

          • <strong>Registrar:</strong> Las estrellas se guardan automáticamente. Samuel las revisará en septiembre.
        </div>
      </div>
      {PROGRAMA_VERANO.map((sem,si)=>(
        <div key={si} className="verano-semana">
          <div className="verano-semana-head" onClick={()=>setSemanaOpen(semanaOpen===si?-1:si)}>
            <div style={{width:40,height:40,borderRadius:10,background:sem.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem',flexShrink:0}}>{sem.emoji}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:'.88rem'}}>Semana {sem.semana} — {sem.mes}</div>
              <div style={{fontSize:'.8rem',fontWeight:600,color:sem.color}}>{sem.titulo}</div>
              <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:1}}>{sem.objetivo}</div>
            </div>
            <span style={{fontSize:'.72rem',background:sem.color+'18',color:sem.color,padding:'2px 10px',borderRadius:20,fontWeight:700}}>{semanaOpen===si?'▲ Cerrar':'▼ Ver días'}</span>
          </div>
          {semanaOpen===si&&(
            <div className="verano-semana-body">
              {sem.dias.map((dia,di)=>(
                <div key={di} className="verano-dia" style={{borderLeftColor:sem.color,background:sem.color+'0D'}}>
                  <div className="verano-dia-title">{dia.dia} — {dia.titulo} <span style={{fontWeight:400,color:'var(--text3)'}}>· {dia.tiempo}</span></div>
                  <div className="verano-dia-acts">{dia.actividades}</div>
                  {dia.material&&<div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>📦 Material: {dia.material}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
      <div className="card" style={{marginTop:'1rem',background:'var(--navy)',color:'#fff'}}>
        <div style={{fontWeight:700,marginBottom:'.5rem'}}>🎒 Objetivo de septiembre</div>
        <div style={{fontSize:'.82rem',color:'rgba(255,255,255,.7)',lineHeight:1.7}}>Al llegar a 1º Primaria, {nombre} habrá trabajado 6 semanas de conciencia fonológica, lenguaje expresivo y atención. Samuel realizará una sesión de reevaluación en septiembre para ajustar el plan.</div>
      </div>
    </div>
  );
}

/* ═══ FAMILIA VIEW v9.1 ════════════════════════ */

  return(
    <div style={{minHeight:'100vh',background:'#FFF8E7',fontFamily:'Nunito,sans-serif'}}>
      <div style={{background:'linear-gradient(135deg,#F97316,#EC4899)',padding:'1rem 1.25rem',display:'flex',alignItems:'center',gap:12}}>

        <div style={{fontWeight:900,fontSize:'1rem',color:'#fff'}}>☀️ Programa de Verano · {nombre}</div>
      </div>
      <div style={{padding:'1.25rem',maxWidth:560,margin:'0 auto'}}>
        <div style={{background:'rgba(249,115,22,.1)',border:'1px solid #F97316',borderRadius:12,padding:'1rem',marginBottom:'1.25rem',fontSize:'.82rem',color:'#7C3AED',fontWeight:700,lineHeight:1.7}}>
          🎯 Plan julio-agosto · 15-25 min al día · 4-5 días a la semana<br/>
          <span style={{fontWeight:400,color:'#374151'}}>Toca cada semana para ver las actividades del día. ¡Usa los ejercicios de la plataforma como base!</span>
        </div>
        {PROGRAMA_VERANO.map((sem,si)=>{
          const [open,setOpen]=useState(si===0);
          return(
            <div key={si} style={{background:'#fff',borderRadius:16,marginBottom:'1rem',overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,.08)'}}>
              <div onClick={()=>setOpen(v=>!v)} style={{display:'flex',alignItems:'center',gap:12,padding:'1rem',cursor:'pointer',borderLeft:`4px solid ${sem.color}`}}>
                <span style={{fontSize:'1.8rem'}}>{sem.emoji}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:'.88rem',color:'#1E1B4B'}}>Semana {sem.semana} — {sem.mes}</div>
                  <div style={{fontSize:'.78rem',color:sem.color,fontWeight:800}}>{sem.titulo}</div>
                  <div style={{fontSize:'.72rem',color:'#6B7280',marginTop:2}}>{sem.objetivo}</div>
                </div>
                <span style={{fontSize:'1.2rem',color:'#9BA8C0'}}>{open?'▲':'▼'}</span>
              </div>
              {open&&(
                <div style={{padding:'0 1rem 1rem'}}>
                  {sem.dias.map((dia,di)=>(
                    <div key={di} style={{borderLeft:`3px solid ${sem.color}`,paddingLeft:'.75rem',marginBottom:'.65rem',background:sem.color+'12',borderRadius:'0 10px 10px 0',padding:'.7rem .9rem'}}>
                      <div style={{fontWeight:900,fontSize:'.82rem',color:'#1E1B4B',marginBottom:3}}>{dia.dia} — {dia.titulo} <span style={{fontWeight:400,color:'#9BA8C0'}}>· {dia.tiempo}</span></div>
                      <div style={{fontSize:'.78rem',color:'#374151',lineHeight:1.75}}>{dia.actividades}</div>
                      {dia.material&&<div style={{fontSize:'.68rem',color:'#9BA8C0',marginTop:4}}>📦 {dia.material}</div>}
                    </div>

                </div>

            </div>
          );
        })}
        <div style={{background:'linear-gradient(135deg,#667eea,#764ba2)',borderRadius:16,padding:'1.25rem',color:'#fff',textAlign:'center',marginBottom:'1rem'}}>
          <div style={{fontSize:'1.5rem',marginBottom:'.35rem'}}>🎒</div>
          <div style={{fontWeight:900,marginBottom:'.25rem'}}>¡Objetivo septiembre!</div>
          <div style={{fontSize:'.82rem',opacity:.85}}>6 semanas de trabajo = {nombre} lista para 1º Primaria</div>
        </div>
        <div style={{textAlign:'center'}}><button onClick={onBack} style={{background:'#667eea',color:'#fff',border:'none',borderRadius:50,padding:'.75rem 2rem',fontFamily:'Nunito,sans-serif',fontWeight:800,cursor:'pointer'}}>← Volver a ejercicios</button></div>
      </div>
    </div>
  );
}

function FamiliaView({patient,onLogout}){
  const [active,setActive]=useState(null);
  const [vistaVerano,setVistaVerano]=useState(false);
  const [sessionStars,setSessionStars]=useState(0);
  const patId=patient?.id||'v';
  const [totalStars,setTotalStars]=useState(()=>ls(`hn_stars_fam_${patId}`,0));

  if(!patient)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#667eea,#764ba2)'}}>
      <div style={{background:'#fff',borderRadius:24,padding:'2rem',textAlign:'center',maxWidth:340}}>
        <div style={{fontSize:'3rem',marginBottom:'1rem'}}>😕</div>
        <div style={{fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'1.2rem',marginBottom:'.5rem'}}>Paciente no encontrado</div>
        <div style={{fontSize:'.85rem',color:'#6B7280',marginBottom:'1rem'}}>Contacta con samuel@unimed-consulting.es</div>
        <button onClick={onLogout} style={{background:'#667eea',color:'#fff',border:'none',borderRadius:50,padding:'.75rem 2rem',fontFamily:'Nunito,sans-serif',fontWeight:700,cursor:'pointer'}}>Volver</button>
      </div>
    </div>
  );

  const nombre=patient.name.split(' ')[0];
  const diags=patient.diagnosis||[];
  let exIds=[];
  diags.forEach(d=>{const list=DIAG_EXERCISES[d];if(list)list.forEach(e=>{if(!exIds.includes(e))exIds.push(e);});});
  if(!exIds.length)exIds=DIAG_EXERCISES['default'];

  const nivel=getNivel(totalStars);
  const nextNivel=getNextNivel(totalStars);

  const onComplete=(stars,type)=>{
    const newTotal=totalStars+stars;
    setSessionStars(s=>s+stars);
    setTotalStars(newTotal);
    lsSet(`hn_stars_fam_${patId}`,newTotal);
    setActive(null);
  };

  if(active)return<ExerciseOverlay type={active} patientName={nombre} totalStars={totalStars} onClose={()=>setActive(null)} onComplete={onComplete}/>;
  if(vistaVerano)return<FamiliaViewVerano onBack={()=>setVistaVerano(false)} nombre={nombre}/>;

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'1.5rem 2rem',fontFamily:'Nunito,sans-serif'}}>
      {/* CABECERA */}
      <div style={{textAlign:'center',marginBottom:'1.25rem'}}>
        <div style={{fontSize:'3rem',marginBottom:'.35rem'}}>🌟</div>
        <div style={{fontWeight:900,fontSize:'1.8rem',color:'#fff',marginBottom:'.2rem'}}>¡Hola, {nombre}!</div>
        <div style={{color:'rgba(255,255,255,.75)',fontSize:'.95rem',fontWeight:600}}>¿Qué hacemos hoy?</div>
      </div>

      {/* NIVEL CARD */}
      <div style={{background:nivel.bg,borderRadius:16,padding:'.85rem 1.25rem',marginBottom:'1rem',width:'100%',maxWidth:480,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontWeight:900,color:nivel.color,fontSize:'.95rem'}}>{nivel.emoji} Nivel {nivel.nivel}: {nivel.nombre}</div>
          <div style={{fontSize:'.75rem',color:nivel.color,opacity:.8,marginTop:2}}>{nivel.desc}</div>
          {nextNivel&&<div style={{fontSize:'.68rem',color:'#6B7280',marginTop:3}}>{nextNivel.min-totalStars} ⭐ para {nextNivel.emoji} {nextNivel.nombre}</div>}
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontWeight:900,fontSize:'1.4rem',color:nivel.color}}>{totalStars}</div>
          <div style={{fontSize:'.68rem',color:'#6B7280'}}>⭐ total</div>
          {sessionStars>0&&<div style={{fontSize:'.72rem',color:nivel.color,fontWeight:800}}>+{sessionStars} hoy</div>}
        </div>
      </div>

      {/* BARRA PROGRESO NIVEL */}
      {nextNivel&&(
        <div style={{width:'100%',maxWidth:480,marginBottom:'1rem'}}>
          <div style={{height:8,background:'rgba(255,255,255,.2)',borderRadius:4,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${Math.min(100,((totalStars-nivel.min)/(nextNivel.min-nivel.min))*100)}%`,background:'#FFD93D',borderRadius:4,transition:'width .5s'}}/>
          </div>
        </div>
      )}

      {/* EJERCICIOS */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'.85rem',width:'100%',maxWidth:480,marginBottom:'1rem'}}>
        {exIds.map(id=>{const m=EX_META[id];return(
          <div key={id} onClick={()=>setActive(id)} style={{background:'#fff',borderRadius:20,padding:'1.1rem',cursor:'pointer',textAlign:'center',boxShadow:'0 4px 20px rgba(0,0,0,.15)',transition:'transform .15s'}}
            onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
            onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
            <div style={{fontSize:'2.5rem',marginBottom:'.35rem'}}>{m.icon}</div>
            <div style={{fontWeight:900,fontSize:'.92rem',color:'#1E1B4B',marginBottom:2}}>{m.name}</div>
            <div style={{fontSize:'.72rem',color:'#6B7280',marginBottom:'.65rem'}}>{m.desc}</div>
            <div style={{background:'linear-gradient(135deg,#667eea,#764ba2)',color:'#fff',borderRadius:50,padding:'.45rem',fontWeight:800,fontSize:'.82rem'}}>▶ Jugar</div>
          </div>
        );})}
      </div>

      {/* BOTÓN PROGRAMA VERANO */}
      <div onClick={()=>setVistaVerano(true)} style={{background:'rgba(255,255,255,.15)',border:'2px solid rgba(255,255,255,.4)',borderRadius:16,padding:'.9rem 1.5rem',cursor:'pointer',textAlign:'center',width:'100%',maxWidth:480,marginBottom:'1.25rem',backdropFilter:'blur(4px)',transition:'background .2s'}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.22)'}
        onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.15)'}>
        <div style={{fontWeight:900,color:'#fff',fontSize:'.95rem'}}>☀️ Programa de Verano 2026</div>
        <div style={{fontSize:'.75rem',color:'rgba(255,255,255,.75)',marginTop:3}}>Plan julio-agosto · Actividades por semana y día</div>
      </div>

      <div style={{fontSize:'.7rem',color:'rgba(255,255,255,.35)',textAlign:'center'}}>
        HoloNeuro TND® v9.1 · ASOC UNIMED<br/>
        <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={onLogout}>Salir</span>
      </div>
    </div>
  );
}

/* ═══ APP SHELL ═════════════════════════════════ */
function App(){
  const [unlocked,setUnlocked]=useState(()=>localStorage.getItem('hn_unlocked')==='1');
  const [mode,setMode]=useState(()=>localStorage.getItem('hn_mode')||'pro');
  const [familiaPatientId,setFamiliaPatientId]=useState(()=>localStorage.getItem('hn_familia_pid')||null);
  const [view,setView]=useState('dash');
  const [patients,setPatients]=useState(()=>ls('hn_patients',[]));
  const [activeId,setActiveId]=useState(()=>ls('hn_active_id',null));
  const [settings,setSettings]=useState(()=>ls('hn_settings',{}));
  useEffect(()=>lsSet('hn_patients',patients),[patients]);
  useEffect(()=>lsSet('hn_active_id',activeId),[activeId]);
  useEffect(()=>lsSet('hn_settings',settings),[settings]);
  const patient=patients.find(p=>p.id===activeId)||null;
  const updatePatient=useCallback(fn=>setPatients(prev=>prev.map(p=>p.id===activeId?fn(p):p)),[activeId]);
  const onNewPatient=()=>{const p=newPatient('Nuevo paciente');setPatients(prev=>[...prev,p]);setActiveId(p.id);setView('patients');};

  const [embeddedFamiliaPatient,setEmbeddedFamiliaPatient]=useState(null);

  const handleUnlock=(m,pid,embeddedPatient)=>{
    setMode(m);setUnlocked(true);
    localStorage.setItem('hn_unlocked','1');
    localStorage.setItem('hn_mode',m);
    if(embeddedPatient){setEmbeddedFamiliaPatient(embeddedPatient);}
    else if(pid){setFamiliaPatientId(pid);localStorage.setItem('hn_familia_pid',pid);}
  };

  const handleLogout=()=>{
    localStorage.removeItem('hn_unlocked');
    localStorage.removeItem('hn_mode');
    localStorage.removeItem('hn_familia_pid');
    setUnlocked(false);setMode('pro');setFamiliaPatientId(null);setEmbeddedFamiliaPatient(null);
  };

  if(!unlocked)return<GatePage onUnlock={handleUnlock} settings={settings}/>;

  if(mode==='familia'){
    const familiaPatient=embeddedFamiliaPatient||patients.find(p=>p.id===familiaPatientId)||null;
    return<FamiliaView patient={familiaPatient} onLogout={handleLogout}/>;
  }

  const titles={dash:'Dashboard',patients:'Gestión de pacientes',protocol:'Protocolo clínico',sessions:'Seguimiento de sesiones',hnae:'Evaluación HNAE',entrenamiento:'Entrenamiento Personalizado',verano:'Programa Verano 2026 ☀️',informes:'Informes PDF',tarifas:'Tarifas y presupuesto',ai:'Asistente Clínico IA',config:'Configuración'};
  const views={
    dash:<Dashboard patient={patient} setView={setView}/>,
    patients:<PacientesView patients={patients} setPatients={setPatients} activeId={activeId} setActiveId={setActiveId}/>,
    protocol:<ProtocolView/>,
    sessions:<SessionsView patient={patient} updatePatient={updatePatient}/>,
    hnae:<HNAEView patient={patient}/>,
    entrenamiento:<EntrenamientoView patient={patient} updatePatient={updatePatient}/>,
    verano:<VeranoView patient={patient}/>,
    informes:<InformesView patient={patient} updatePatient={updatePatient}/>,
    tarifas:<TarifasView/>,
    ai:<AIView patient={patient}/>,
    config:<ConfigView settings={settings} setSettings={setSettings} patients={patients} setPatients={setPatients}/>,
  };
  const navItems=[
    {id:'dash',i:'◈',l:'Dashboard'},
    {id:'patients',i:'◉',l:'Pacientes'},
    {id:'protocol',i:'◎',l:'Protocolo clínico'},
    {id:'sessions',i:'▤',l:'Sesiones'},
    {id:'hnae',i:'◐',l:'Evaluación HNAE'},
    {id:'entrenamiento',i:'🎮',l:'Entrenamiento'},
    {id:'verano',i:'☀️',l:'Programa Verano',badge:'NEW'},
    {id:'informes',i:'◆',l:'Informes PDF'},
    {id:'tarifas',i:'◇',l:'Tarifas'},
    {id:'ai',i:'✦',l:'Asistente IA'},
    {id:'config',i:'⚙',l:'Configuración'},
  ];
  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo"><div className="sidebar-logo-dot"/><div><div className="sidebar-logo-text">HoloNeuro TND®</div><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.3)'}}>v9.1 · Plataforma UNIMED</div></div></div>
        {patients.length>0&&(
          <div className="patient-switcher">
            <div className="ps-label">Paciente activo</div>
            <select className="ps-select" value={activeId||''} onChange={e=>setActiveId(e.target.value)}>
              {!activeId&&<option value="">Seleccionar…</option>}
              {patients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <div className="ps-new" onClick={onNewPatient}>+ Nuevo paciente</div>
          </div>
        )}
        <div className="nav-section">Módulos</div>
        {navItems.map(it=>(
          <div key={it.id} className={`nav-item${view===it.id?' active':''}`} onClick={()=>setView(it.id)}>
            <span className="ni">{it.i}</span>
            {it.l}
            {it.badge&&<span style={{fontSize:'.58rem',background:'#F97316',color:'#fff',borderRadius:8,padding:'1px 5px',marginLeft:'auto',fontWeight:700}}>{it.badge}</span>}
          </div>
        ))}
        <div className="nav-section" style={{marginTop:'1rem'}}>Cuenta</div>
        <div className="nav-item" onClick={handleLogout}><span className="ni">↩</span>Cerrar sesión</div>
        <div className="sidebar-user" style={{marginTop:'1rem'}}><div className="su-name">Samuel Carmona, MSc</div><div className="su-role">Consultor Biomédico · UNIMED</div></div>
      </div>
      <div className="main">
        <div className="topbar"><span className="topbar-title">{titles[view]}{patient&&['sessions','hnae','informes','verano'].includes(view)?` · ${patient.name}`:''}</span><div className="flex-row"><span style={{fontSize:'.72rem',background:'var(--teal10)',color:'var(--teal)',padding:'3px 10px',borderRadius:20,fontWeight:600}}>HoloNeuro TND® v9.1</span><span className="badge badge-mg">UNIMED</span></div></div>
        {views[view]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
