<!DOCTYPE html>
<html lang="es">
<head>

<title>HoloNeuro TND® · Plataforma UNIMED</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1B3C;--magenta:#E42465;--teal:#3A7D8C;--gold:#C9A84C;--navy10:#E8EBF2;--magenta10:#FCE7EE;--teal10:#EAF3F5;--gold10:#FAF4E0;--bg:#F4F6FB;--surface:#fff;--border:#E2E6F0;--text1:#0F1B3C;--text2:#5A6580;--text3:#9BA8C0;--r:10px;--r-sm:6px}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text1);line-height:1.5;min-height:100vh}
.gate{display:flex;min-height:100vh}
.gate-left{flex:1;background:var(--navy);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between}
.gate-right{width:460px;padding:3rem;display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-dot{width:32px;height:32px;border-radius:50%;background:var(--magenta)}
.logo-text{font-family:'DM Serif Display',serif;font-size:1.1rem;color:#fff}
.gate-title{font-family:'DM Serif Display',serif;font-size:2.6rem;line-height:1.15;margin-bottom:.9rem}
.gate-title em{color:var(--gold);font-style:normal}
.gate-sub{color:rgba(255,255,255,.65);font-size:.9rem;line-height:1.7;margin-bottom:2rem}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:1rem}
.feat-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.feat-label{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:1px}
.feat-desc{font-size:.75rem;color:rgba(255,255,255,.5)}
.gate-divider{height:1px;background:rgba(255,255,255,.12);margin:1.5rem 0}
.stripe-btn{width:100%;padding:14px;background:var(--magenta);color:#fff;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;text-decoration:none;display:block;text-align:center;margin-bottom:.75rem}
.stripe-btn:hover{opacity:.88}
.stripe-note{font-size:.75rem;color:var(--text3);text-align:center;margin-bottom:1.5rem}
.divider-or{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;font-size:.75rem;color:var(--text3)}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}
.inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;color:var(--text1);outline:none;transition:border .2s;margin-bottom:10px}
.inp:focus{border-color:var(--navy)}
.btn-primary{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--magenta);font-size:.8rem;margin:.5rem 0}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);display:flex;flex-direction:column;padding:1.25rem 1rem}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;padding:0 .5rem}
.sidebar-logo-dot{width:26px;height:26px;border-radius:50%;background:var(--magenta)}
.sidebar-logo-text{font-family:'DM Serif Display',serif;font-size:.95rem;color:#fff}
.patient-switcher{background:rgba(255,255,255,.07);border-radius:8px;padding:.75rem;margin-bottom:1rem}
.ps-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.35);margin-bottom:.4rem}
.ps-select{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-family:inherit;font-size:.82rem;padding:7px 10px;outline:none;cursor:pointer}
.ps-select option{background:var(--navy);color:#fff}
.ps-new{font-size:.73rem;color:rgba(255,255,255,.45);cursor:pointer;margin-top:.4rem;text-decoration:underline}
.ps-new:hover{color:rgba(255,255,255,.7)}
.nav-section{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.3);padding:0 .75rem;margin:.6rem 0 .3rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;cursor:pointer;transition:background .15s;color:rgba(255,255,255,.6);font-size:.85rem;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.ni{font-size:14px;width:18px;text-align:center}
.sidebar-user{margin-top:auto;padding:.65rem;background:rgba(255,255,255,.06);border-radius:7px}
.su-name{font-size:.8rem;font-weight:700;color:#fff}
.su-role{font-size:.68rem;color:rgba(255,255,255,.38)}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{padding:1rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-weight:700;font-size:1rem}
.content{padding:1.75rem 2rem;flex:1}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:1.25rem}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-bottom:1.25rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem}
.stat-label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--navy)}
.stat-sub{font-size:.72rem;color:var(--text3);margin-top:1px}
.stat-card.accent-mg{border-left:3px solid var(--magenta)}
.stat-card.accent-tl{border-left:3px solid var(--teal)}
.stat-card.accent-gd{border-left:3px solid var(--gold)}
.stat-card.accent-nv{border-left:3px solid var(--navy)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.sec-title{font-weight:700;font-size:.95rem}
.phase{border:1px solid var(--border);border-radius:var(--r);margin-bottom:.65rem;overflow:hidden;background:var(--surface)}
.phase-header{display:flex;align-items:center;gap:12px;padding:.9rem 1.1rem;cursor:pointer}
.phase-header:hover{background:var(--bg)}
.phase-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.phase-body{padding:1.1rem;border-top:1px solid var(--border);background:#fafbfe}
.phase-item{font-size:.82rem;color:var(--text2);padding:.4rem 0;border-bottom:1px solid var(--border)}
.phase-item:last-child{border-bottom:none}
.phase-item strong{color:var(--text1);display:block;font-size:.83rem;margin-bottom:1px}
.track-tabs{display:flex;gap:4px;background:var(--border);padding:3px;border-radius:7px;margin-bottom:1.1rem;width:fit-content}
.track-tab{padding:6px 18px;border-radius:5px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text2)}
.track-tab.active{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.sessions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
.sess{border:1.5px solid var(--border);border-radius:var(--r-sm);padding:.9rem;cursor:pointer;transition:all .15s;background:var(--surface)}
.sess:hover{border-color:var(--teal);transform:translateY(-1px)}
.sess.done{background:var(--teal10);border-color:var(--teal)}
.sess.current{border-color:var(--magenta);box-shadow:0 0 0 2px rgba(228,36,101,.1)}
.sess-num{font-size:.68rem;color:var(--text3);margin-bottom:3px}
.sess-title{font-size:.8rem;font-weight:600;color:var(--text1);margin-bottom:5px}
.sess-status{font-size:.7rem;font-weight:600}
.sess.done .sess-status{color:var(--teal)}
.sess.current .sess-status{color:var(--magenta)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:1.5rem}
.modal-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:1.1rem}
.modal-title{font-weight:700;font-size:.98rem}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text3);padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--bg)}
.obj-list{margin:.75rem 0;list-style:none}
.obj-list li{font-size:.82rem;color:var(--text2);padding:.35rem 0;border-bottom:1px solid var(--border);display:flex;align-items:start;gap:7px}
.obj-list li:before{content:"→";color:var(--teal);font-weight:700;flex-shrink:0}
textarea.inp{height:80px;resize:vertical;margin-bottom:0}
.btn-sm{padding:7px 14px;border-radius:var(--r-sm);font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:opacity .2s}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{opacity:.88}
.btn-mg{background:var(--magenta);color:#fff}
.btn-mg:hover{opacity:.88}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{opacity:.88}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.check-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.check-row label{font-size:.85rem;cursor:pointer}
input[type=checkbox]{accent-color:var(--teal);width:15px;height:15px;cursor:pointer}
.hnae-step{border:1px solid var(--border);border-radius:var(--r);margin-bottom:.65rem;overflow:hidden;background:var(--surface)}
.hnae-head{padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.hnae-head:hover{background:var(--bg)}
.hnae-body{padding:1.1rem;border-top:1px solid var(--border)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.75rem}
.field-label{font-size:.75rem;font-weight:600;color:var(--text2);margin-bottom:.3rem;display:block}
.prog-bar{height:5px;background:var(--border);border-radius:3px;margin:.5rem 0 .3rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--magenta));border-radius:3px;transition:width .4s}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:.5rem 0;display:flex;flex-direction:column;gap:.65rem}
.msg{max-width:84%;padding:.85rem 1rem;border-radius:var(--r);font-size:.85rem;line-height:1.65}
.msg.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--navy);color:#fff;align-self:flex-end}
.msg-role{font-size:.68rem;font-weight:700;color:var(--teal);margin-bottom:.25rem}
.chat-input-row{display:flex;gap:.65rem;padding-top:.9rem;border-top:1px solid var(--border)}
.chat-input-row textarea{flex:1;min-height:42px;max-height:110px;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:.85rem;resize:none;outline:none}
.chat-input-row textarea:focus{border-color:var(--teal)}
.loading-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text3);margin:0 2px;animation:dot .8s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.tarifa-row{display:flex;align-items:center;gap:12px;padding:.75rem 0;border-bottom:1px solid var(--border)}
.tarifa-row:last-child{border-bottom:none}
.tarifa-check{flex-shrink:0}
.tarifa-info{flex:1}
.tarifa-name{font-size:.88rem;font-weight:600}
.tarifa-desc{font-size:.75rem;color:var(--text2)}
.tarifa-price{font-size:.95rem;font-weight:700;color:var(--navy);flex-shrink:0;min-width:70px;text-align:right}
.tarifa-highlight{background:var(--gold10);border-radius:6px;padding:.25rem .6rem;border-left:3px solid var(--gold)}
.total-bar{background:var(--navy);color:#fff;border-radius:var(--r);padding:1.1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.total-label{font-size:.8rem;opacity:.65}
.total-amount{font-size:1.6rem;font-weight:700}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.score-label{font-size:.82rem;color:var(--text2);width:120px;flex-shrink:0}
.score-input{width:65px}
.score-bar{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.score-fill-pre{height:100%;background:var(--text3);border-radius:4px;transition:width .3s}
.score-fill-post{height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.patient-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;cursor:pointer;transition:all .15s}
.patient-card:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(58,125,140,.1)}
.patient-card.active-pat{border-color:var(--magenta);border-width:2px}
.pc-name{font-weight:700;font-size:.95rem;margin-bottom:3px}
.pc-diag{font-size:.75rem;color:var(--text2)}
.pc-meta{font-size:.72rem;color:var(--text3);margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;font-size:.7rem;font-weight:700;padding:2px 8px}
.badge-mg{background:var(--magenta10);color:var(--magenta)}
.badge-tl{background:var(--teal10);color:var(--teal)}
.badge-gd{background:var(--gold10);color:#8a6800}
.badge-nv{background:var(--navy10);color:var(--navy)}
.flex-row{display:flex;align-items:center;gap:.7rem}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt1{margin-top:.75rem}
.mt2{margin-top:1.25rem}
.text-sm{font-size:.8rem;color:var(--text2)}
.divider{height:1px;background:var(--border);margin:1rem 0}
select.inp{cursor:pointer}
.config-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem}
.config-title{font-weight:700;font-size:.9rem;margin-bottom:.75rem}
.code-pill{display:inline-flex;align-items:center;gap:6px;background:var(--navy10);border-radius:6px;padding:4px 10px;font-size:.78rem;font-weight:600;margin:.25rem;color:var(--navy)}
</style>

    if(!form.name.trim())return;
    setPatients(prev=>form.id&&prev.find(p=>p.id===form.id)?prev.map(p=>p.id===form.id?form:p):[...prev,form.id?form:{...form,id:uid()}]);

  };

/* ═══ SESSIONS ══════════════════════════════════ */
function SessionsView({patient,updatePatient}){
  const [track,setTrack]=useState('A');
  const [modal,setModal]=useState(null);
  if(!patient)return<div className="content"><div className="text-sm" style={{padding:'2rem',textAlign:'center'}}>Selecciona un paciente para gestionar las sesiones.</div></div>;
  const list=SESS_OBJ[track];
  const cur=patient.sessions[track];
  const done=cur.filter(s=>s.done).length;
  const update=(id,changes)=>updatePatient(p=>({...p,sessions:{...p.sessions,[track]:p.sessions[track].map(s=>s.id===id?{...s,...changes}:s)}}));
  return(
    <div className="content">
      <div className="flex-between" style={{marginBottom:'1rem'}}><div><div style={{fontSize:'1.05rem',fontWeight:700}}>Sesiones · {patient.name}</div><div className="text-sm" style={{marginTop:2}}>{done}/{list.length} completadas en Track {track}</div></div><span className="badge badge-tl">{Math.round(done/list.length*100)}%</span></div>
      <div className="prog-bar"><div className="prog-fill" style={{width:`${done/list.length*100}%`}}/></div>
      <div className="track-tabs">
        {['A','B','C'].map(t=><div key={t} className={`track-tab${track===t?' active':''}`} onClick={()=>setTrack(t)}>Track {t}{t==='A'?' — Clínico':t==='B'?' — Escolar':' — Monitor.'}</div>)}
      </div>
      <div className="sessions-grid">
        {list.map((s,i)=>{
          const st=cur.find(c=>c.id===s.id)||{done:false,note:''};
          const isCur=!st.done&&(i===0||(cur.find(c=>c.id===list[i-1]?.id)||{}).done);
          return(
            <div key={s.id} className={`sess${st.done?' done':isCur?' current':''}`} onClick={()=>setModal({...s,...st,track})}>
              <div className="sess-num">Sesión {s.id}</div>
              <div className="sess-title">{s.obj.substring(0,42)}{s.obj.length>42?'…':''}</div>
              <div className="sess-status">{st.done?'✓ Completada':isCur?'● En curso':'○ Pendiente'}</div>
              {st.date&&<div style={{fontSize:'.65rem',color:'var(--text3)',marginTop:3}}>{fmtDate(st.date)}</div>}
            </div>
          );
        })}
      </div>
      {modal&&(
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-head">
              <div><span className="badge badge-mg" style={{marginBottom:6,display:'inline-flex'}}>Sesión {modal.id} · Track {modal.track}</span><div className="modal-title">{modal.obj}</div></div>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="text-sm" style={{fontWeight:600,marginBottom:'.5rem'}}>Contenidos:</div>
            <ul className="obj-list">{modal.topics.map((t,i)=><li key={i}>{t}</li>)}</ul>
            <div className="divider"/>
            <label className="field-label">Notas clínicas</label>
            <textarea className="inp" placeholder="Observaciones, respuesta del paciente…" defaultValue={modal.note||''} id="sess-note"/>
            <div className="flex-row mt1">
              <button className="btn-sm btn-teal" onClick={()=>{const note=document.getElementById('sess-note').value;update(modal.id,{done:!modal.done,note,date:!modal.done?new Date().toISOString().slice(0,10):modal.date});setModal(null);}}>{modal.done?'Marcar pendiente':'Marcar completada'}</button>
              <button className="btn-sm btn-outline" onClick={()=>{const note=document.getElementById('sess-note').value;update(modal.id,{note});setModal(null);}}>Guardar notas</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ HNAE ══════════════════════════════════════ */
function HNAEView({patient}){
  const [open,setOpen]=useState('fhh');
  if(!patient)return<div className="content"><div className="text-sm" style={{padding:'2rem',textAlign:'center'}}>Selecciona un paciente para completar la evaluación HNAE.</div></div>;
  const steps=[
    {id:'fhh',label:'FHH — Historicidad y Holografía',tag:'Historia',fields:[['Nombre del paciente','Fecha de nacimiento'],['Diagnóstico principal','Diagnósticos secundarios'],['Escuela / nivel educativo','Profesionales en seguimiento'],['Antecedentes prenatales/perinatales','Historia familiar de TND']],checks:['Historia del neurodesarrollo completa','Patrón heredable familiar revisado','Contexto escolar y social documentado','Preferencias y recursos del paciente identificados']},
    {id:'cph',label:'CPH — Cuestionario Psicoeducativo Holónico',tag:'140+ ítems',fields:[['Edad cronológica','Nivel de escolarización'],['Principales quejas funcionales','Contexto familiar']],checks:['Autocompletado por padres/tutores enviado','Análisis gráfico CAPS Digital revisado','Dominios atención/lenguaje/motor/emocional/sensorial','Comparativa con normas por edad completada']},
    {id:'pgx',label:'PGx — Perfil Farmacogenómico',tag:'Opcional',fields:[['Medicación actual','Medicación previa y respuesta'],['Laboratorio de análisis','Fecha de extracción de muestra']],checks:['CYP2D6 — metabolizador (metilfenidato/atomoxetina)','CYP2C19 — inhibidores/antidepresivos','COMT — perfil dopaminérgico','DAT1 / DRD4 — sistema dopamina-TDAH','MTHFR — folato y función cognitiva']},
  ];
  const [progs,setProgs]=useState({fhh:0,cph:0,pgx:0});
  const overall=Math.round(Object.values(progs).reduce((a,b)=>a+b,0)/3);
  return(
    <div className="content">
      <div style={{marginBottom:'1.25rem'}}><div style={{fontSize:'1.05rem',fontWeight:700}}>Evaluación HNAE · {patient.name}</div><div className="text-sm" style={{marginTop:2}}>HoloNeuro Assessment Engine — evaluación integral de baseline.</div></div>
      <div style={{marginBottom:'1rem'}}>
        <div className="flex-between"><span className="text-sm">Progreso total</span><span className="badge badge-tl">{overall}%</span></div>
        <div className="prog-bar" style={{height:7,marginTop:'.35rem'}}><div className="prog-fill" style={{width:`${overall}%`}}/></div>
      </div>
      {steps.map(st=>(
        <div className="hnae-step" key={st.id}>
          <div className="hnae-head" onClick={()=>setOpen(open===st.id?null:st.id)}>
            <div><div style={{fontWeight:700,fontSize:'.88rem'}}>{st.label}</div><div className="text-sm" style={{marginTop:1}}>{progs[st.id]}% completado</div></div>
            <span className="badge badge-nv">{st.tag}</span>
          </div>
          {open===st.id&&(
            <div className="hnae-body">
              <div className="field-grid" style={{marginBottom:'.75rem'}}>{st.fields.map((pair,i)=>pair.map((f,j)=><div key={`${i}-${j}`}><label className="field-label">{f}</label><input className="inp" style={{marginBottom:0}} placeholder={f}/></div>))}</div>
              <div className="divider"/>
              <div className="field-label" style={{marginBottom:'.4rem'}}>Lista de comprobación</div>
              {st.checks.map((c,i)=><div className="check-row" key={i}><input type="checkbox" id={`${st.id}-${i}`} onChange={()=>{const n=document.querySelectorAll(`[id^="${st.id}-"]:checked`).length;setProgs(p=>({...p,[st.id]:Math.round(n/st.checks.length*100)}));}}/><label htmlFor={`${st.id}-${i}`}>{c}</label></div>)}
              <div style={{marginTop:'.75rem'}}><div className="prog-bar"><div className="prog-fill" style={{width:`${progs[st.id]}%`}}/></div><div className="text-sm">{progs[st.id]}% completado</div></div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

          <div className="card">
            <div className="sec-title" style={{marginBottom:'.75rem'}}>Condiciones de pago</div>
            {['Sin IVA incluido — añadir 21% si aplica.','Pago posible en 2–3 cuotas sin recargo.','Validez del presupuesto: 30 días.','Factura disponible tras confirmación.','Cancelación con 48h de antelación.'].map((c,i)=><div key={i} className="text-sm" style={{padding:'4px 0',borderBottom:'1px solid var(--border)',display:'flex',gap:7}}><span style={{color:'var(--teal)'}}>·</span>{c}</div>)}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══ AI ASSISTANT ══════════════════════════════ */
function AIView({patient}){
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem('hn_api_key')||'');
  const [showKey,setShowKey]=useState(!localStorage.getItem('hn_api_key'));
  const [msgs,setMsgs]=useState([{role:'ai',text:'Hola, Samuel. Soy el asistente clínico HoloNeuro TND® (Claude). Puedo ayudarte con orientación sobre el protocolo, interpretación de perfiles HNAE, estrategias clínicas para TDAH/TEA/dislexia, y razonamiento causal HoloSemiótico. ¿En qué trabajamos hoy?'}]);
  const [input,setInput]=useState('');const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),[msgs]);
  const saveKey=()=>{localStorage.setItem('hn_api_key',apiKey);setShowKey(false);};
  const send=useCallback(async()=>{
    if(!input.trim()||loading)return;
    const txt=input.trim();setInput('');
    setMsgs(m=>[...m,{role:'user',text:txt}]);setLoading(true);
    const ctx=patient?`Paciente activo: ${patient.name}, diagnósticos: ${patient.diagnosis.join(', ')||'no especificados'}, ${patient.sessions.A.filter(s=>s.done).length}/16 sesiones Track A completadas.`:'Sin paciente activo.';
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:`Eres el asistente clínico del Método HoloNeuro TND® de ASOC UNIMED (Samuel Carmona Aguirre, MSc, Biomedical Scientist). Contexto actual: ${ctx}. Ayudas con: protocolo HoloNeuro TND® (fases 0-4, 16 sesiones Track A/B/C), evaluación HNAE (FHH, CPH, PGx), estrategias clínicas para TDAH, TEA Nivel 1-2, dislexia, trastornos del lenguaje preescolar/primaria, TPS, TPA. Marco teórico: HoloSemiótica, GDH (Gemelo Digital Holónico), ciclo OODA+S+L, MH-AIAP (UNESCO 2016). Responde en español, de forma concisa y clínica. Evita diagnósticos directos sin contexto completo.`,messages:[...msgs.filter((_,i)=>i>0).slice(-8).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text})),{role:'user',content:txt}]})});
      const d=await res.json();
      setMsgs(m=>[...m,{role:'ai',text:d.content?.[0]?.text||'Sin respuesta.'}]);
    }catch{setMsgs(m=>[...m,{role:'ai',text:'Error de conexión. Verifica tu API key de Anthropic en la configuración.'}]);}
    setLoading(false);
  },[input,loading,msgs,apiKey,patient]);
  return(
    <div className="content" style={{display:'flex',flexDirection:'column',height:'calc(100vh - 90px)'}}>
      <div className="flex-between" style={{marginBottom:'.85rem'}}>
        <div><div style={{fontSize:'1.05rem',fontWeight:700}}>Asistente Clínico IA</div><div className="text-sm">Orientación clínica con el protocolo HoloNeuro TND® y razonamiento HoloSemiótico.</div></div>
        <button className="btn-sm btn-outline" style={{fontSize:'.72rem'}} onClick={()=>setShowKey(v=>!v)}>API Key</button>
      </div>
      {showKey&&<div style={{background:'var(--navy10)',borderRadius:8,padding:'1rem',marginBottom:'.85rem'}}><div className="text-sm" style={{marginBottom:'.5rem'}}>Introduce tu API Key de Anthropic para activar el asistente.</div><div className="flex-row"><input className="inp" style={{marginBottom:0,flex:1}} type="password" placeholder="sk-ant-..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/><button className="btn-sm btn-teal" onClick={saveKey}>Guardar</button></div><div style={{fontSize:'.7rem',color:'var(--text3)',marginTop:6}}>Guardada localmente. Nunca se envía a servidores UNIMED.</div></div>}
      <div className="chat-wrap">
        <div className="chat-msgs">
          {msgs.map((m,i)=><div key={i} className={`msg ${m.role}`}>{m.role==='ai'&&<div className="msg-role">HoloNeuro Asistente</div>}<div style={{whiteSpace:'pre-wrap'}}>{m.text}</div></div>)}
          {loading&&<div className="msg ai"><div className="msg-role">HoloNeuro Asistente</div><div className="loading-dots"><span/><span/><span/></div></div>}
          <div ref={endRef}/>
        </div>
        <div className="chat-input-row">
          <textarea placeholder="Pregunta sobre el protocolo, un caso clínico, estrategias TND…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}/>
          <button className="btn-sm btn-teal" onClick={send} disabled={loading||!input.trim()} style={{alignSelf:'flex-end',padding:'10px 16px'}}>Enviar →</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ CONFIG ════════════════════════════════════ */
function ConfigView({settings,setSettings}){
  const [extraCode,setExtraCode]=useState('');
  const addCode=()=>{const c=extraCode.trim().toUpperCase();if(c&&!settings.extraCodes?.includes(c)){setSettings(s=>({...s,extraCodes:[...(s.extraCodes||[]),c]}));setExtraCode('');}};
  const removeCode=(c)=>setSettings(s=>({...s,extraCodes:(s.extraCodes||[]).filter(x=>x!==c)}));
  return(
    <div className="content">
      <div style={{marginBottom:'1.25rem'}}><div style={{fontSize:'1.05rem',fontWeight:700}}>Configuración</div><div className="text-sm" style={{marginTop:2}}>Gestiona pagos, códigos de acceso y ajustes de la plataforma.</div></div>
      <div className="config-section">
        <div className="config-title">🔗 Stripe — Enlace de pago</div>
        <div className="text-sm" style={{marginBottom:'.75rem'}}>Crea un Payment Link en tu dashboard de Stripe (<strong>stripe.com</strong>) y pégalo aquí. Al hacer clic en "Comprar acceso" en la pantalla de entrada, los usuarios serán redirigidos a Stripe. Tras el pago, envías el código manualmente.</div>
        <label className="field-label">URL del Payment Link de Stripe</label>
        <input className="inp" placeholder="https://buy.stripe.com/xxxx..." value={settings.stripeUrl||''} onChange={e=>setSettings(s=>({...s,stripeUrl:e.target.value}))}/>
        <div className="text-sm" style={{marginTop:4}}>💡 Configura el precio en 97€ y el nombre del producto como "HoloNeuro TND® — Acceso anual".</div>
      </div>
      <div className="config-section">
        <div className="config-title">🔑 Códigos de acceso</div>
        <div className="text-sm" style={{marginBottom:'.75rem'}}>Añade códigos para distribuir a profesionales que hayan pagado. Los códigos integrados (HNAV-2026, UNIMED-PROF-001, DEMO-2026) siempre están activos.</div>
        <div style={{marginBottom:'.75rem'}}>
          <div className="text-sm" style={{fontWeight:600,marginBottom:6}}>Códigos por defecto (no eliminables):</div>
          {DEFAULT_CODES.map(c=><span key={c} className="code-pill">{c}</span>)}
        </div>
        {(settings.extraCodes||[]).length>0&&<div style={{marginBottom:'.75rem'}}><div className="text-sm" style={{fontWeight:600,marginBottom:6}}>Códigos añadidos:</div>{(settings.extraCodes||[]).map(c=><span key={c} className="code-pill" style={{cursor:'pointer'}} onClick={()=>removeCode(c)}>{c} ✕</span>)}</div>}
        <div className="flex-row">
          <input className="inp" style={{marginBottom:0,flex:1}} placeholder="Nuevo código (ej. UNIMED-PROF-010)" value={extraCode} onChange={e=>setExtraCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCode()}/>
          <button className="btn-sm btn-teal" onClick={addCode}>Añadir</button>
        </div>
        <div className="text-sm" style={{marginTop:8}}>Los códigos se guardan localmente en este navegador. Para gestión de códigos en producción, usa una base de datos o hoja de cálculo de Google.</div>
      </div>
      <div className="config-section">
        <div className="config-title">📧 Datos de contacto</div>
        {[['contactEmail','Email de contacto','samuel@unimed-consulting.es'],['contactPhone','Teléfono',''],['website','Web','unimed-consulting.es']].map(([k,l,ph])=>(
          <div key={k} style={{marginBottom:'.65rem'}}><label className="field-label">{l}</label><input className="inp" style={{marginBottom:0}} placeholder={ph} value={settings[k]||''} onChange={e=>setSettings(s=>({...s,[k]:e.target.value}))}/></div>
        ))}
      </div>
      <div className="config-section" style={{background:'var(--navy)',color:'#fff'}}>
        <div style={{fontWeight:700,marginBottom:'.5rem'}}>Guía de despliegue</div>
        <div style={{fontSize:'.82rem',color:'rgba(255,255,255,.65)',lineHeight:1.7}}>
          1. Sube este archivo HTML a tu hosting (Galirede / GitHub Pages).<br/>
          2. Crea el Payment Link en Stripe y pega la URL en la sección de arriba.<br/>
          3. Comparte el archivo con los primeros profesionales usando el código DEMO-2026.<br/>
          4. Cuando alguien pague, añade su código personalizado aquí y envíaselo por email.<br/>
          5. Para gestión avanzada (base de datos real), conecta con un backend o usa Zapier + Google Sheets.
        </div>
      </div>
    </div>
  );
}

/* ═══ APP SHELL ═════════════════════════════════ */
function App(){
  const [unlocked,setUnlocked]=useState(()=>localStorage.getItem('hn_unlocked')==='1');
  const [view,setView]=useState('dash');
  const [patients,setPatients]=useState(()=>ls('hn_patients',[]));
  const [activeId,setActiveId]=useState(()=>ls('hn_active_id',null));
  const [settings,setSettings]=useState(()=>ls('hn_settings',{}));
  useEffect(()=>lsSet('hn_patients',patients),[patients]);
  useEffect(()=>lsSet('hn_active_id',activeId),[activeId]);
  useEffect(()=>lsSet('hn_settings',settings),[settings]);
  const patient=patients.find(p=>p.id===activeId)||null;
  const updatePatient=useCallback(fn=>setPatients(prev=>prev.map(p=>p.id===activeId?fn(p):p)),[activeId]);
  const onNewPatient=()=>{const p=newPatient('Nuevo paciente');setPatients(prev=>[...prev,p]);setActiveId(p.id);setView('patients');};
  const titles={dash:'Dashboard',patients:'Gestión de pacientes',protocol:'Protocolo clínico',sessions:'Seguimiento de sesiones',hnae:'Evaluación HNAE',informes:'Informes PDF',tarifas:'Tarifas y presupuesto',ai:'Asistente Clínico IA',config:'Configuración'};
  const views={
    dash:<Dashboard patient={patient} setView={setView}/>,
    patients:<PacientesView patients={patients} setPatients={setPatients} activeId={activeId} setActiveId={setActiveId}/>,
    protocol:<ProtocolView/>,
    sessions:<SessionsView patient={patient} updatePatient={updatePatient}/>,
    hnae:<HNAEView patient={patient}/>,
    informes:<InformesView patient={patient} updatePatient={updatePatient}/>,
    tarifas:<TarifasView/>,
    ai:<AIView patient={patient}/>,
    config:<ConfigView settings={settings} setSettings={setSettings}/>,
  };
  if(!unlocked)return<GatePage onUnlock={()=>setUnlocked(true)} settings={settings}/>;
  return(
    <div className="app">
      <Sidebar view={view} setView={setView} patients={patients} activeId={activeId} setActiveId={setActiveId} onNewPatient={onNewPatient} onLogout={()=>{localStorage.removeItem('hn_unlocked');setUnlocked(false);}}/>
      <div className="main">
        <div className="topbar"><span className="topbar-title">{titles[view]}{patient&&['sessions','hnae','informes'].includes(view)?` · ${patient.name}`:''}</span><div className="flex-row"><span style={{fontSize:'.72rem',background:'var(--teal10)',color:'var(--teal)',padding:'3px 10px',borderRadius:20,fontWeight:600}}>HoloNeuro TND® v2.0</span><span className="badge badge-mg">UNIMED</span></div></div>
        {views[view]}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
